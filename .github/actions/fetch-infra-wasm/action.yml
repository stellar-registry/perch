name: Fetch pinned infra
description: >
  Install the Stellar CLI + registry plugin and resolve the perch infra by NAME
  into the git-ignored cache crates/perch-smart-account/wasm/ (stateless.id + the
  two .wasm) that the account reads at build time. Any job that compiles
  perch-smart-account needs this before cargo runs.
runs:
  using: composite
  steps:
    - name: Install Stellar CLI + registry plugin
      shell: bash
      run: |
        # Core CLI (host for the `stellar registry` plugin + `contract fetch`).
        if ! command -v stellar >/dev/null; then
          v=27.1.0
          curl -fsSL -o /tmp/stellar.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${v}/stellar-cli-${v}-x86_64-unknown-linux-gnu.tar.gz"
          sudo tar -xzf /tmp/stellar.tar.gz -C /usr/local/bin stellar
        fi
        # Registry plugin (resolves `unverified/perch`), via cargo-binstall (prebuilt).
        if ! stellar registry --help >/dev/null 2>&1; then
          command -v cargo-binstall >/dev/null || \
            curl -fsSL https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y stellar-registry-cli
        fi
    - name: Fetch pinned infra by name
      shell: bash
      run: scripts/fetch-infra-wasm.sh
