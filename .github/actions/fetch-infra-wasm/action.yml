name: Fetch pinned infra
description: >
  Fetch the account's and the factory's pinned wasm (crates/perch-smart-account/wasm/,
  crates/perch-account-factory/wasm/) from deployments/testnet.json: every wasm
  fetched by its recorded address or hash and refused unless its sha256 and
  content address match the manifest. Builds read only the committed pins; the
  tests that load the pinned bytes need this before cargo runs.
inputs:
  stack:
    description: Also fetch every deployed artifact into this directory (with a build.json) for the release-stack suite.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-stellar
    - name: Fetch pinned infra from the deployment manifest
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      run: scripts/fetch-infra-wasm.sh ${STACK:+--stack "$STACK"}
