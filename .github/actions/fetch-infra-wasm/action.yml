name: Fetch pinned infra wasm
description: >
  Install the Stellar CLI and fetch the deployed perch infra wasm that the
  account pins (by sha256) at build time. Any job that compiles perch-smart-account
  needs this before cargo runs, because crates/perch-smart-account/wasm/*.wasm is
  git-ignored (fetched, not committed). Core CLI only — no registry plugin.
runs:
  using: composite
  steps:
    - name: Install stellar-cli
      shell: bash
      run: |
        if ! command -v stellar >/dev/null; then
          v=27.1.0
          curl -fsSL -o /tmp/stellar.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${v}/stellar-cli-${v}-x86_64-unknown-linux-gnu.tar.gz"
          # Extract onto an existing PATH dir rather than writing $GITHUB_PATH.
          sudo tar -xzf /tmp/stellar.tar.gz -C /usr/local/bin stellar
        fi
    - name: Fetch pinned infra wasm
      shell: bash
      run: PLUGIN_FREE=1 scripts/fetch-infra-wasm.sh
