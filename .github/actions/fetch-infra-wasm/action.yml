name: Fetch pinned infra
description: >
  Install the Stellar CLI and fetch the deployed perch infra (stateless.id + the
  two .wasm) into the git-ignored cache crates/perch-smart-account/wasm/ that the
  account reads at build time. Any job that compiles perch-smart-account needs
  this before cargo runs. Core CLI only (`stellar contract fetch` by id) — the
  registry plugin can't address the nested `unverified/perch/stateless` subregistry.
runs:
  using: composite
  steps:
    - name: Install stellar-cli
      shell: bash
      run: |
        if ! command -v stellar >/dev/null; then
          v=27.1.0
          curl -fsSL -o /tmp/stellar.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${v}/stellar-cli-${v}-x86_64-unknown-linux-gnu.tar.gz"
          sudo tar -xzf /tmp/stellar.tar.gz -C /usr/local/bin stellar
        fi
    - name: Fetch pinned infra
      shell: bash
      run: scripts/fetch-infra-wasm.sh
