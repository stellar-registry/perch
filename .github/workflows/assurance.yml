# Heavy assurance passes that don't belong on the PR path: coverage-guided
# fuzzing, mutation testing, and branch coverage of the security core.
# Weekly + on demand. Findings here are bugs to fix or tests to add, not
# merge gates (yet) — see docs/verification/PLAN.md phase 0.
name: Assurance

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NIGHTLY: nightly-2026-02-05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly-2026-02-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      # Corpus persists across weekly runs so coverage accumulates instead of
      # restarting from scratch; keyed by run id (always saves), restored from
      # the latest prior run.
      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      - run: cargo install cargo-fuzz --locked
      # -s none: ASan fails to link soroban-sdk's rlib, and the targets are
      # pure safe Rust — the findings of interest are panics and divergence.
      - name: Fuzz each target
        run: |
          for t in eval_fail_closed ir_parse_roundtrip; do
            cargo +"$NIGHTLY" fuzz run -s none "$t" -- -max_total_time=300
          done
      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  mutants:
    runs-on: ubuntu-latest
    # Burn-in: surviving mutants are missing-test findings, not merge blockers.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-mutants --locked
      # .cargo/mutants.toml sets test_workspace = true, so every mutant faces
      # the conformance vectors + differential suite, not just in-package tests.
      - run: cargo mutants -p perch-program -p perch-compile -p perch-ir
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-out
          path: mutants.out

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --branch coverage requires a nightly toolchain; reuse the flux pin.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly-2026-02-05
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo +nightly-2026-02-05 llvm-cov -p perch-program -p perch-compile -p perch-ir -p perch-conformance --branch

  # Komet (Runtime Verification, K framework): fuzz + symbolic execution of the
  # RPN evaluator's wasm under the mechanized Soroban + KWasm semantics — an
  # independent second opinion whose trusted base is the K semantics, not
  # rustc/LLVM + wasmi (see komet/README.md, docs/verification/PLAN.md phase 3).
  #
  # Komet is installed from Nix, pinned to the v0.1.88 release, and pulled
  # prebuilt from RV's public `k-framework` Cachix cache (the whole closure —
  # K, the haskell backend, and the bundled Soroban semantics — is published
  # there, so nothing compiles from source and no separate `komet-kdist build`
  # is needed). Burn-in: continue-on-error while the soroban-sdk 27 contract is
  # confirmed to run under semantics whose examples pin sdk 22.
  komet:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32v1-none
      - name: Install Nix
        uses: cachix/install-nix-action@754537aaedb35f72ab11a60cc162c49ef3016495 # v31.2.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.0/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # RV publishes komet's entire dependency closure here; read-only, no token.
      - name: Use k-framework Cachix cache
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: k-framework
          skipPush: true
      - name: Install Komet (pinned)
        run: nix profile install github:runtimeverification/komet/v0.1.88
      # komet reads the contract ABI via `stellar contract info interface`
      # (from the wasm's contractspecv0 section — no rebuild). Pin v27.1.0, the
      # version komet v0.1.88's flake tracks.
      - name: Install stellar-cli
        run: |
          curl -fsSL -o /tmp/stellar.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/stellar.tar.gz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Build with cargo, then strip the DataCount section komet v0.1.88's
      # pykwasm parser rejects (id 0xc; emitted by the bulk-memory feature,
      # unused by soroban's memory model). The soroban custom sections —
      # including the contractspecv0 ABI komet reads — are preserved. `komet
      # test --wasm` consumes the prepared wasm and skips its own build.
      - name: Build + prepare the contract wasm
        working-directory: komet
        run: |
          cargo build --release --target wasm32v1-none
          python3 strip_datacount.py \
            target/wasm32v1-none/release/perch_komet_tests.wasm \
            target/perch_komet_tests.komet.wasm
      # Fuzzes all three properties (50 examples each) by executing the real
      # evaluator bytecode under RV's mechanized Soroban + KWasm semantics — the
      # independent second opinion. `komet prove run` (symbolic, all u32) is the
      # stronger check but is too slow for CI (>30 min); run it locally, see
      # komet/README.md.
      - name: Fuzz the properties (komet test)
        working-directory: komet
        run: komet test --wasm target/perch_komet_tests.komet.wasm --max-examples 50
