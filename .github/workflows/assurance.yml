# Heavy assurance passes that don't belong on the PR path: coverage-guided
# fuzzing, mutation testing, and branch coverage of the security core.
# Weekly + on demand. Findings here are bugs to fix or tests to add, not
# merge gates (yet) — see docs/verification/PLAN.md phase 0.
name: Assurance

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NIGHTLY: nightly-2026-02-05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly-2026-02-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # -s none: ASan fails to link soroban-sdk's rlib, and the targets are
      # pure safe Rust — the findings of interest are panics and divergence.
      - name: Fuzz each target
        run: |
          for t in eval_fail_closed ir_parse_roundtrip; do
            cargo +"$NIGHTLY" fuzz run -s none "$t" -- -max_total_time=300
          done

  mutants:
    runs-on: ubuntu-latest
    # Burn-in: surviving mutants are missing-test findings, not merge blockers.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-mutants --locked
      - run: cargo mutants -p perch-program -p perch-compile -p perch-ir
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-out
          path: mutants.out

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov -p perch-program -p perch-compile -p perch-ir -p perch-conformance --branch
