name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release-stack step asks whether the deployment's source
          # commit is in this branch's history.
          fetch-depth: 0
      # Pinned to the v1 tag on master, whose history is never rewritten; the
      # `stable` branch is regenerated, which orphans any commit pinned on it.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # z3 backs the perch-analyze SMT tests (they skip loudly when absent).
      - run: sudo apt-get update && sudo apt-get install -y z3
      # The account and the factory pin their dependencies to the sha256 of
      # the deployed wasm, read at build time from their git-ignored wasm/
      # caches. Fetch them, hash- and address-checked, from
      # deployments/testnet.json before anything compiles them; the deployed
      # stack lands in target/stack for the release-stack suite below.
      - uses: ./.github/actions/fetch-infra-wasm
        with:
          stack: target/stack
      # Whether the recorded deployment is this branch's: built from a commit
      # in its history. A pull request below the deployment record changes
      # contracts the deployment predates, so its tests pin this source's own
      # build (pin order, against the manifest's registry) instead of the
      # deployed bytes, and the checks of the deployed bytes (testnet_pins,
      # and the release-stack suite below) skip until the next deployment.
      - name: Is the deployment this branch's?
        id: deployment
        run: |
          deployed="$(jq -r .source.commit deployments/testnet.json)"
          if git merge-base --is-ancestor "$deployed" HEAD 2>/dev/null; then
            echo "ours=true" >> "$GITHUB_OUTPUT"
          else
            echo "ours=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deployments/testnet.json was built from $deployed, outside this branch's history: tests pin this source's build, and the deployed-bytes checks skip until the next deployment"
          fi
      - name: Pin this source's build
        if: steps.deployment.outputs.ours == 'false'
        run: |
          scripts/build-stack.sh --builder contract \
            --registry "$(jq -r .registry.id deployments/testnet.json)" --out target/source-stack
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        env:
          OURS: ${{ steps.deployment.outputs.ours }}
        run: |
          if [ "$OURS" = true ]; then
            cargo test --workspace
          else
            cargo test --workspace -- --skip consumers_pin_the_deployment_manifest
          fi
      # The manifest against the chain: every contract at its content address
      # running its recorded wasm, and what the factory, adapter, pool, and
      # exercised accounts actually resolve.
      - run: scripts/verify-deployment.sh
      # Every recovery flow through the deployed bytes, with real proofs from
      # the pinned nargo/bb under enforcing authorization, when they are this
      # branch's: built from a commit in its history. A deployment from
      # outside it (a rebased branch) runs other contract code, which this
      # source's types and flows do not describe; release-stack-source runs
      # the suite on this source, and verify-deployment.sh above still checks
      # the chain against the manifest.
      - name: Release stack with real proofs
        run: |
          deployed="$(jq -r .source.commit deployments/testnet.json)"
          if ! git merge-base --is-ancestor "$deployed" HEAD 2>/dev/null; then
            echo "::notice::deployments/testnet.json was built from $deployed, outside this branch's history: skipping the deployed-bytes release suite until the next deployment"
            exit 0
          fi
          eval "$(scripts/zk-toolchain.sh)"
          cargo test -p perch-integration-tests --test release_stack -- --ignored --test-threads 2 \
            --skip cap_sweep
      # Wasm leg of the conformance vectors: the compiled artifact must agree
      # with the vectors under the soroban host (rustc/LLVM/wasmi in the loop).
      - run: cargo build -p perch-bench-rpn --target wasm32v1-none --release
      - run: cargo test -p perch-conformance --test wasm_leg -- --ignored

  # The PR's own source as a deployment of it would run: every contract built
  # in pin order by scripts/build-stack.sh (tier 0, then the account against
  # tier 0's hashes, then the factory against the account's), then every
  # recovery flow through those fresh bytes with real proofs. The rust job
  # above checks the deployed bytes; this one catches a change that only a
  # rebuilt stack would break.
  release-stack-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/setup-stellar
      # Core `stellar contract build`: the deployed builds' code without
      # scaffold's name/version metadata. The registry is the manifest's, so
      # every address is where a deployment would put it.
      - name: Build the stack from source in pin order
        run: |
          scripts/build-stack.sh --builder contract \
            --registry "$(jq -r .registry.id deployments/testnet.json)" --out target/source-stack
      - name: Release stack with real proofs, on the fresh wasm
        env:
          PERCH_STACK_DIR: target/source-stack
        run: |
          eval "$(scripts/zk-toolchain.sh)"
          cargo test -p perch-integration-tests --test release_stack -- --ignored --test-threads 2 \
            --skip cap_sweep

  # Flux refinement verification of perch-program (nidohq/soroban-flux).
  # Runs under flux's pinned nightly; the deploy/test toolchain stays stable.
  # Graduated from burn-in: a flux failure now fails CI.
  flux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FLUX_REV: 283ad737569f80951973747ef16f1a89d64d9728
      FLUX_NIGHTLY: nightly-2026-02-05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install flux nightly
        run: |
          rustup toolchain install "$FLUX_NIGHTLY" \
            --component rust-src --component rustc-dev --component llvm-tools \
            --profile minimal
      # restore/save split (not actions/cache): the post-job save of the combined
      # action caches whatever exists even when the install step died midway,
      # poisoning the immutable key with a partial toolchain. Save is now an
      # explicit step that only runs after a successful install, and the presence
      # check re-installs if a restored cache is missing any binary.
      - name: Restore flux toolchain cache
        id: flux-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.flux
            ~/.cargo/bin/flux
            ~/.cargo/bin/cargo-flux
            ~/.cargo/bin/fixpoint
            ~/.cargo/bin/z3
          key: flux-${{ runner.os }}-${{ env.FLUX_REV }}
      - name: Check flux toolchain presence
        id: flux-bins
        run: |
          present=true
          for b in z3 fixpoint cargo-flux flux; do
            command -v "$b" >/dev/null || { echo "missing: $b"; present=false; }
          done
          [ -d "$HOME/.flux" ] || { echo "missing: ~/.flux"; present=false; }
          echo "present=$present" >> "$GITHUB_OUTPUT"
      - name: Install z3 + liquid-fixpoint + flux
        if: steps.flux-bins.outputs.present != 'true'
        run: |
          set -euo pipefail
          BIN="$HOME/.cargo/bin"; mkdir -p "$BIN"
          url=$(curl -fsSL https://api.github.com/repos/Z3Prover/z3/releases/latest \
                | grep -o 'https://[^"]*-x64-glibc[^"]*\.zip' | head -1)
          tmp=$(mktemp -d)
          curl -fsSL "$url" -o "$tmp/z3.zip"
          unzip -qo "$tmp/z3.zip" -d "$tmp"
          install -m755 "$tmp"/z3-*/bin/z3 "$BIN/z3"
          curl -fsSL "https://github.com/ucsd-progsys/liquid-fixpoint/releases/download/nightly/fixpoint-x86_64-linux-gnu.tar.gz" | tar xz -C "$BIN"
          chmod +x "$BIN/fixpoint"
          git clone https://github.com/flux-rs/flux "$tmp/flux"
          git -C "$tmp/flux" checkout "$FLUX_REV"
          (cd "$tmp/flux" && cargo xtask install)
      - name: Save flux toolchain cache
        if: steps.flux-bins.outputs.present != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.flux
            ~/.cargo/bin/flux
            ~/.cargo/bin/cargo-flux
            ~/.cargo/bin/fixpoint
            ~/.cargo/bin/z3
          key: flux-${{ runner.os }}-${{ env.FLUX_REV }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: target/flux-cache
      - name: cargo flux -p perch-program
        run: |
          RUSTUP_TOOLCHAIN="$FLUX_NIGHTLY" \
          FLUXFLAGS="-Fpointer-width=32 -Fcheck-overflow=strict -Fcache=target/flux-cache" \
          cargo flux -p perch-program

  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One leg per npm package (see packages/): perch-js is the PolicyDoc
        # surface, perch-interpreter-js the interpreter contract bindings,
        # perch-zk the ZK recovery proof helpers and pool indexer (proves with
        # bb.js in-test), perch-relay the guardian-approval relay,
        # perch-contracts the stack bindings generated from the deployment.
        package: [perch-js, perch-interpreter-js, perch-zk, perch-relay, perch-contracts]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test

  # Every npm package as `npm publish` would ship it: packed, installed from
  # the tarball into an empty project, every entry point imported. Nothing
  # is published.
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: scripts/check-packages.sh

  # ZK recovery: the circuit's own tests, a byte-for-byte rebuild of every
  # committed artifact (ACIR, VKs, proof fixtures, manifest) with the pinned
  # toolchain, and the metered on-chain costs of the compiled pool/adapter.
  zk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No toolchain action: rustup installs the channel and the wasm32v1-none
      # target from rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # scripts/zk-toolchain.sh installs the pinned nargo/bb under target/
      # (checksummed) on first use and prints NARGO/BB; later calls are no-ops.
      - name: Circuit tests
        run: |
          eval "$(scripts/zk-toolchain.sh)"
          cd circuits && "$NARGO" test --workspace
      - name: Artifacts reproduce, and committed ZK proofs verify
        run: |
          eval "$(scripts/zk-toolchain.sh)"
          cargo run -q -p perch-zk-prover --bin perch-zk-fixtures -- check
      - name: Metered costs within the per-transaction limits
        run: |
          eval "$(scripts/zk-toolchain.sh)"
          cargo run -q -p perch-zk-prover --bin perch-zk-fixtures -- bench 1
          cargo build --release --target wasm32v1-none -p perch-zk-pool -p perch-zk-adapter
          cargo build --release --target wasm32v1-none -p perch-zk-pool -p perch-zk-adapter \
            --features perch-zk-pool/tree-depth-24,perch-zk-adapter/tree-depth-24 \
            --target-dir target/zk-d24
          cargo test -q -p perch-zk-adapter --test costs -- --ignored --nocapture --test-threads 1

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
