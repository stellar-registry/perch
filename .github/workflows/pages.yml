name: Pages

# Publishes docs/ (entry point: docs/index.html) to the gh-pages
# branch, which GitHub Pages serves. PR previews (deck-preview.yml) live under
# /pr-preview/ on the same branch — clean-exclude keeps production deploys
# from wiping them.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The papers' PDF editions are built without write access and deployed beside
  # the HTML editions that link them.
  paper-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tectonic
      - run: docs/perch-paper/latex/build.sh --stage "$PDF_STAGE"
        env:
          PDF_STAGE: ${{ runner.temp }}/perch-pdfs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perch-paper-pdf
          path: ${{ runner.temp }}/perch-pdfs
          if-no-files-found: error

  deploy:
    needs: paper-pdf
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        # the deploy action pushes gh-pages with the checkout token, so
        # credentials must persist for this job (unlike the rest of CI).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: perch-paper-pdf
          path: docs/perch-paper
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
