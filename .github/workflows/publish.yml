name: Publish to registry

# The on-chain half of a release: release-plz merges the release PR and pushes
# the perch-interpreter-v* tag (via the App token, so this fires), we build the
# wasm at the tag and publish it to the perch subregistry, authorized by the
# smart account's ci-publish policy — the CI key is a CAP-0071 DELEGATED signer
# scoped to publish/publish_hash with author = the account itself. It can do
# nothing else.
on:
  push:
    tags:
      - "perch-interpreter-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish, e.g. perch-interpreter-v0.2.0"
        required: true
        type: string
      environment:
        description: "Deployment environment"
        required: true
        default: testnet
        type: choice
        options: [testnet, mainnet]

permissions: {}

concurrency:
  group: registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # mainnet adds required-reviewer protection on the environment; testnet none.
    environment: ${{ inputs.environment || 'testnet' }}
    permissions:
      contents: write # gh release upload
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      STELLAR_NETWORK: ${{ (inputs.environment == 'mainnet') && 'mainnet' || 'testnet' }}
      STELLAR_RPC_URL: ${{ vars.STELLAR_RPC_URL }}
      STELLAR_NETWORK_PASSPHRASE: ${{ vars.STELLAR_NETWORK_PASSPHRASE }}
      PERCH_REGISTRY_CONTRACT_ID: ${{ vars.PERCH_REGISTRY_CONTRACT_ID }}
      PERCH_AUTHOR_ADDRESS: ${{ vars.PERCH_AUTHOR_ADDRESS }}
      PERCH_CI_RULE_ID: ${{ vars.PERCH_CI_RULE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32v1-none
      - uses: stellar/stellar-cli@5a7c5fe76530bf4248477ac812fc757146b98cc4 # v27.0.0
      - name: Install stellar-scaffold-cli
        run: cargo install --locked stellar-scaffold-cli
      # No build caches in a publish job (zizmor cache-poisoning: nothing a
      # cache write could later inject into a signed release build).
      - name: Build contract wasm (with name/binver meta)
        run: stellar scaffold build
      - name: Derive version from tag and cross-check wasm meta
        run: |
          BINVER="${TAG#perch-interpreter-v}"
          echo "BINVER=$BINVER" >> "$GITHUB_ENV"
          WASM="target/stellar/$STELLAR_NETWORK/perch_interpreter.wasm"
          echo "WASM=$WASM" >> "$GITHUB_ENV"
          meta_binver=$(stellar contract info meta --wasm "$WASM" | sed -n 's/^ • binver: \(.*\)$/\1/p')
          if [ "$meta_binver" != "$BINVER" ]; then
            echo "tag version $BINVER != wasm meta binver $meta_binver" >&2
            exit 1
          fi
      - name: Preflight (simulate only)
        env:
          PERCH_CI_KEY: ${{ secrets.PERCH_CI_KEY }}
        run: |
          cargo run -q -p perch-deploy -- publish --dry-run \
            --wasm "$WASM" --wasm-name perch-interpreter --binver "$BINVER" \
            --registry "$PERCH_REGISTRY_CONTRACT_ID" \
            --author "$PERCH_AUTHOR_ADDRESS" \
            --rule-id "$PERCH_CI_RULE_ID"
      - name: Publish on-chain
        env:
          PERCH_CI_KEY: ${{ secrets.PERCH_CI_KEY }}
        run: |
          cargo run -q -p perch-deploy -- publish \
            --wasm "$WASM" --wasm-name perch-interpreter --binver "$BINVER" \
            --registry "$PERCH_REGISTRY_CONTRACT_ID" \
            --author "$PERCH_AUTHOR_ADDRESS" \
            --rule-id "$PERCH_CI_RULE_ID" \
            --receipt publish-receipt.json
      - name: Attach wasm + receipt to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$WASM" publish-receipt.json --clobber
