name: Release

# Two chained halves:
#
#   1. `detect-releases` — on every push to main, tag any contract whose crate
#      manifest `version` has no matching `<contract>-v<version>` tag yet (i.e.
#      it was bumped in the merged PR). Releases are ON-CHAIN wasm publishes, not
#      crates.io, so this is pure git — NO release-plz / `cargo package`, which
#      couldn't resolve the workspace's git-only + intra-workspace path deps
#      against the crates.io index and also packaged the immutable last-release
#      tags as its diff baseline, wedging the pipeline. To release a contract,
#      bump its version in a PR.
#   2. The infra publishes (`publish-plan` → `constructorless-build` →
#      `constructorless-publish`) — a generic, contract-AGNOSTIC fan-out:
#      whichever infra contracts this run released (the ALLOW list in
#      publish-plan: perch-interpreter, perch-doc-compiler,
#      perch-ed25519-verifier, perch-spending-limit) are each built+attested
#      and published + `deploy_stateless`'d (content-addressed, salt =
#      wasm_hash) into unverified/perch/constructorless via the reusable
#      stellar-registry/actions workflows (contract-release →
#      registry-publish), authored by the perch-author-account smart account
#      and signed by the theahaco/stellar-cli fork (on-chain rule discovery —
#      no perch-deploy). No per-contract code — the set is data (see
#      publish-plan). That registry is perch's ONE canonical registry: an
#      account or factory bakes a single registry id and derives every infra
#      address as deployer(registry, sha256(wasm)), so every contract one
#      consumer resolves must live in the same registry. (The spending limit
#      used to have its own chain into unverified/perch/stateless; that
#      registry is retired and keeps only perch-spending-limit <= 0.1.1.)
#
# A third, off-chain leg — `npm-publish` — mirrors the same convention for
# the TypeScript packages: detect-releases also tags `<pkg>-v<version>` when a
# packages/<pkg> manifest version was bumped in the merged PR (perch-js →
# @stellar-registry/perch, perch-interpreter-js →
# @stellar-registry/perch-interpreter), and the npm-publish matrix job then
# publishes each released package to npm (NPM_TOKEN secret).
#
# The recovery stack (verifiers, ZK pool and adapter, controller, account,
# factory) is deployed in pin order by scripts/deploy-stack.sh, which writes
# the deployment manifest (deployments/<network>.json) every consumer's
# build-time pins are fetched and verified from (scripts/fetch-infra-wasm.sh,
# docs/deploy/README.md). Its contracts are tagged and version-tracked here
# like the rest, but are not in the publish-plan allow-list: publishing them
# to the canonical registry is a separate, deliberate step (see the
# publish-plan comment). The account and the factory pin what they consume,
# so their release always follows the publication of their tier-0 pins.
#
# All publish halves hang off `needs:` in the SAME run (gated on the
# detect-releases `releases` output) instead of a tag/release trigger, so they
# fire even though the tag was pushed with the default GITHUB_TOKEN — no GitHub
# App required. (This is why the old per-contract publish.yml, which needed the
# App token's tag push to retrigger, was folded in here and removed.)
#
# ONE-TIME BOOTSTRAP (manager-signed), once per NEW wasm name: the
# constructorless registry is MANAGED — while its manager is set, the INITIAL
# publish of a wasm name needs the manager's signature (registry error #12
# ManagerRequired otherwise); that first publish also binds the name's author
# for good (the registry has no author transfer), and every later version
# needs only the author's own authorization (the smart account's ci-publish
# rule). So before a contract newly added to ALLOW can publish, the manager
# publishes an earlier version of it with author = the perch-author smart
# account (vars.PERCH_AUTHOR_ADDRESS), using any wasm already uploaded to the
# network (e.g. the contract's previous release):
#
#   stellar contract invoke --id <constructorless registry> --network testnet \
#     --source-account <manager> -- publish_hash \
#     --wasm_name <name> --author <PERCH_AUTHOR_ADDRESS> \
#     --wasm_hash <uploaded hash> --version <earlier version>
#
# (Versions must be strictly increasing, so the bootstrap version must be
# below the first CI release.) If a release merges first, its publish leg
# fails with #12 and the tag stays: after the bootstrap, re-run it with the
# `publish_tag` dispatch input (detect-releases never re-tags a version).

on:
  push:
    branches: [main]
  # Recovery path — PUBLISH-ONLY: re-run the on-chain half against the
  # existing, already-attested release asset for the tag (e.g. after a
  # transient RPC failure). It never rebuilds, so it doesn't matter how far
  # main has moved: integrity comes from `gh attestation verify` against the
  # pinned reusable signer workflow, not from git position. If the BUILD half
  # failed instead, use the failed run's native "Re-run failed jobs" (same
  # sha), after deleting the GitHub release if it got as far as creating one
  # (`gh release delete <tag>` — keep the tag).
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Existing tag of an ALLOW-listed contract to (re)publish to unverified/perch/constructorless, e.g. perch-spending-limit-v0.1.2"
        required: false
        type: string

permissions: {}

# Dispatch recovery runs get their own group: the shared group has ONE pending
# slot, and a push landing while another push run is active would silently
# cancel a queued dispatch (cancel-in-progress only protects the RUNNING run).
# A dispatch racing a push run is on-chain-safe: the fetch_hash preflight
# skips a same-hash republish and refuses a different-hash one, and
# deploy_stateless is idempotent.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-plz-dispatch-{0}', inputs.publish_tag) || 'release-plz' }}
  cancel-in-progress: false

jobs:
  # Detect which contracts to release — WITHOUT release-plz or `cargo package`.
  # Perch never publishes to crates.io (releases are on-chain wasm publishes), so
  # release-plz's `cargo package --workspace` change-detection was a structural
  # mismatch: the workspace's git-only + intra-workspace path deps can't all
  # resolve on the crates.io index, and release-plz also packages the immutable
  # last-release tags as its diff baseline — commits whose manifests can't be
  # retroactively fixed — which permanently wedged the pipeline. Instead: a
  # contract is "released" when its crate manifest `version` has no matching
  # `<contract>-v<version>` tag yet (i.e. someone bumped it in a merged PR). Pure
  # git, no packaging. Emits the same `releases` shape the publish halves consume,
  # so everything downstream is unchanged.
  detect-releases:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create + push the per-contract tags
    outputs:
      releases_created: ${{ steps.detect.outputs.releases_created }}
      releases: ${{ steps.detect.outputs.releases }}
      npm_released: ${{ steps.npm.outputs.npm_released }}
      npm_releases: ${{ steps.npm.outputs.npm_releases }}
    steps:
      # Default token + persisted credentials are enough to push a tag. Tags
      # pushed with GITHUB_TOKEN do NOT retrigger workflows, but the publish
      # halves below run via `needs:` in THIS same run, so no retrigger (and no
      # GitHub App) is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0 # full tag history for the version-bump comparison
      - name: Detect released contracts (manifest version bumped past its tag)
        id: detect
        run: |
          set -euo pipefail
          # The release-tracked contracts. To release one, bump its `version` in
          # crates/<contract>/Cargo.toml in a PR; on merge this tags + publishes
          # it. The constructorless allow-list in publish-plan decides which of
          # these actually publish on-chain (the rest just get a tag).
          CONTRACTS="perch-interpreter perch-doc-compiler perch-ed25519-verifier perch-spending-limit perch-account perch-stateless-registry perch-recovery perch-webauthn-verifier perch-zk-pool perch-zk-adapter perch-account-factory"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          releases='[]'
          for c in $CONTRACTS; do
            ver=$(grep -m1 '^version = "' "crates/$c/Cargo.toml" | sed 's/^version = "\(.*\)"/\1/')
            tag="$c-v$ver"
            # Already released? (tag exists) — skip.
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then continue; fi
            # Guard against a downgrade: never tag a version <= the highest existing tag.
            last=$(git tag -l "$c-v*" | sed "s|^$c-v||" | sort -V | tail -1)
            if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$ver" "$last" | sort -V | tail -1)" != "$ver" ]; then
              echo "::warning::$c manifest version $ver is not greater than last tag $last — skipping"
              continue
            fi
            git tag "$tag"
            git push origin "$tag"
            releases=$(jq -c --arg p "$c" --arg t "$tag" --arg v "$ver" '. + [{package_name:$p, tag:$t, version:$v}]' <<<"$releases")
            echo "released $tag"
          done
          {
            echo "releases=$releases"
            n=$(jq length <<<"$releases")
            echo "releases_created=$([ "$n" -gt 0 ] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### Released this run"
            jq -r 'if length==0 then "_none — no contract version bumped_" else (.[] | "- \(.tag)") end' <<<"$releases"
          } >>"$GITHUB_STEP_SUMMARY"
      # Same convention for the npm packages: packages/<pkg> is "released"
      # when its manifest version has no <pkg>-v<version> tag yet. Feeds the
      # npm-publish matrix below (npm registry instead of on-chain wasm).
      # (perch-interpreter-js-v* never collides with the contract's
      # perch-interpreter-v* tags: the "-js-v"/"-v" suffixes differ.)
      - name: Detect released npm packages (manifest version bumped past its tag)
        id: npm
        run: |
          set -euo pipefail
          # packages/perch-zk, perch-relay, and perch-contracts are built,
          # tested, and pack-checked in CI but deliberately not listed:
          # adding one here publishes it to npm on its next merge.
          NPM_PACKAGES="perch-js perch-interpreter-js"
          npm_releases='[]'
          for p in $NPM_PACKAGES; do
            ver=$(jq -r .version "packages/$p/package.json")
            # Strict semver shape — the version flows into later `run:` shells.
            if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "unexpected $p version: '$ver'" >&2
              exit 1
            fi
            tag="$p-v$ver"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists — nothing to release"
              continue
            fi
            last=$(git tag -l "$p-v*" | sed "s|^$p-v||" | sort -V | tail -1)
            if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$ver" "$last" | sort -V | tail -1)" != "$ver" ]; then
              echo "::warning::$p manifest version $ver is not greater than last tag $last — skipping"
              continue
            fi
            git tag "$tag"
            git push origin "$tag"
            npm_releases=$(jq -c --arg p "$p" --arg t "$tag" --arg v "$ver" '. + [{package:$p, tag:$t, version:$v}]' <<<"$npm_releases")
            echo "released $tag"
            echo "- $tag (npm)" >>"$GITHUB_STEP_SUMMARY"
          done
          {
            echo "npm_releases=$npm_releases"
            n=$(jq length <<<"$npm_releases")
            echo "npm_released=$([ "$n" -gt 0 ] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"

  # Version bumps + changelogs — git-cliff driven, NO cargo package. Companion to
  # detect-releases (which tags on merge): on every push to main this computes
  # each contract's next version from its conventional commits (scoped to its
  # crate tree + the intra-workspace libs it embeds), bumps the manifest,
  # regenerates crates/<c>/CHANGELOG.md, and opens/updates one "chore: release"
  # PR. Merging that PR bumps the versions on main, which detect-releases then
  # tags + publishes. This is release-plz's UX (auto semver bump + changelog +
  # release PR) rebuilt on git history, sidestepping the cargo-package wedge.
  # (The PR is opened with GITHUB_TOKEN, so its own CI checks don't run — the
  # bumps are mechanical; real CI ran on the feature PRs.)
  release-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0 # git-cliff needs full history + tags
      - name: Install git-cliff
        run: |
          mkdir -p "$RUNNER_TEMP/gc"
          curl -fsSL https://github.com/orhun/git-cliff/releases/download/v2.14.1/git-cliff-2.14.1-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/gc.tar.gz"
          echo "bb40f68e752db1a32526c43e0108e8eff785f7c24c67024cffe1c316e034372975fd78c9af8e9a48148235aad15c9a103f1a5b490c282f1db09a7a793794b69f  $RUNNER_TEMP/gc.tar.gz" | sha512sum -c -
          tar -xz -C "$RUNNER_TEMP/gc" --strip-components=1 -f "$RUNNER_TEMP/gc.tar.gz"
          echo "$RUNNER_TEMP/gc" >>"$GITHUB_PATH"
      - name: Compute version bumps + changelogs
        id: prep
        run: |
          set -uo pipefail
          # Each contract's changelog/version scope = its own crate tree + the
          # intra-workspace lib crates it embeds, so a lib change re-releases the
          # contract that ships it. Update these lists if a contract's perch deps
          # change: scripts/test-release-scripts.py (CI) fails when a list
          # misses a crate the contract links. A bare name is a crate under
          # crates/; an entry with a slash is a repo path (perch-zk-adapter
          # compiles in vendor/'s verifier).
          paths_for() { case "$1" in
            perch-interpreter) echo "perch-interpreter perch-program";;
            perch-doc-compiler) echo "perch-doc-compiler perch-compile perch-ir perch-program perch-recovery-interface";;
            # perch-smart-account depends on perch-recovery-interface (the
            # controller hook, account view, and pool insertion clients), so an
            # interface change re-releases the account too — see AGENTS.md's
            # version-pin sharp edge.
            perch-account) echo "perch-account perch-smart-account perch-doc-compiler perch-compile perch-ir perch-program perch-registry-resolve perch-registry-resolve-macro perch-recovery-interface";;
            perch-recovery) echo "perch-recovery perch-recovery-interface perch-doc-compiler perch-compile perch-ir perch-program";;
            perch-zk-pool) echo "perch-zk-pool perch-zk-primitives perch-recovery-interface";;
            # The verification key the adapter compiles in lives in its own
            # crate (vk/), so a circuit change re-releases it; so does a
            # change to the vendored verifier it links (a path with a `/` is
            # taken from the repository root).
            perch-zk-adapter) echo "perch-zk-adapter perch-zk-primitives perch-recovery-interface vendor/ultrahonk-soroban-verifier";;
            # The factory pins the account wasm and the WebAuthn verifier, so
            # a change to either is a new factory.
            perch-account-factory) echo "perch-account-factory perch-account perch-smart-account perch-doc-compiler perch-compile perch-ir perch-program perch-registry-resolve perch-registry-resolve-macro perch-recovery-interface perch-webauthn-verifier";;
            *) echo "$1";;
          esac; }
          CONTRACTS="perch-interpreter perch-doc-compiler perch-ed25519-verifier perch-spending-limit perch-account perch-stateless-registry perch-recovery perch-webauthn-verifier perch-zk-pool perch-zk-adapter perch-account-factory"
          summary=""
          bumped=""
          for c in $CONTRACTS; do
            inc=()
            for d in $(paths_for "$c"); do
              case "$d" in
                */*) inc+=(--include-path "$d/**");;
                *) inc+=(--include-path "crates/$d/**");;
              esac
            done
            # Build inputs no crate tree holds (the locked external packages
            # the contract links, the workspace pins it inherits, the release
            # profile, the toolchain) change its wasm without touching a scoped
            # path, often in a chore(deps) commit cliff.toml skips: each change
            # since its last tag counts as one fix(deps) commit, so a re-pin
            # of the OZ fork or soroban-sdk re-releases every contract linking
            # it. A release commit's own version bumps are not such a change.
            deps_out=$(python3 scripts/release-deps.py cliff-args "$c") || { echo "::error::scripts/release-deps.py failed for $c"; exit 1; }
            deps=()
            [ -z "$deps_out" ] || mapfile -t deps <<<"$deps_out"
            # feat -> minor, fix -> patch; pre-1.0 breaking stays minor (cliff.toml).
            # Returns the crate's current version when nothing is releasable.
            next_tag=$(git cliff --config cliff.toml --tag-pattern "$c-v.*" "${inc[@]}" "${deps[@]}" --bumped-version 2>/dev/null) || true
            next_ver=${next_tag#"$c"-v}
            cur=$(grep -m1 '^version = "' "crates/$c/Cargo.toml" | sed 's/^version = "\(.*\)"/\1/')
            [ -n "$next_ver" ] || continue
            [ "$next_ver" != "$cur" ] || continue
            # Only a strict increase (guards the race where detect-releases has
            # already tagged this version on the release-PR merge push).
            [ "$(printf '%s\n%s\n' "$cur" "$next_ver" | sort -V | tail -1)" = "$next_ver" ] || continue
            sed -i "s|^version = \"[^\"]*\"|version = \"$next_ver\"|" "crates/$c/Cargo.toml"
            git cliff --config cliff.toml --tag-pattern "$c-v.*" "${inc[@]}" "${deps[@]}" --bump -o "crates/$c/CHANGELOG.md" 2>/dev/null
            summary="${summary}- \`$c\`: $cur -> $next_ver"$'\n'
            echo "bump $c: $cur -> $next_ver"
            bumped="${bumped}$c=$next_ver"$'\n'
          done
          # Sync every intra-workspace path-dependency pin to the version its
          # target crate just moved to. Without this, a 0.x MINOR bump here
          # (breaking, under Cargo's caret rules) leaves a dependent's pin
          # stale and `cargo metadata` fails workspace-wide the next time
          # anything touches that dependent — see AGENTS.md's version-pin
          # sharp edge (this used to be a manual "grep and bump every match"
          # step, which is exactly how that failure mode happened before).
          if [ -n "$bumped" ]; then
            while IFS='=' read -r name ver; do
              [ -n "$name" ] || continue
              for f in crates/*/Cargo.toml; do
                grep -qE "^${name} = \{ version = \"[^\"]*\", path = " "$f" || continue
                sed -i -E "s|^(${name} = \{ version = \")[^\"]*(\", path = )|\1${ver}\2|" "$f"
                echo "synced pin: $f -> $name $ver"
              done
            done <<<"$bumped"
          fi
          # The npm packages ride the same convention: tag-pattern <pkg>-v*,
          # scoped to packages/<pkg>. Bump via `npm version` so
          # package-lock.json stays in sync with the manifest.
          npm_name() { case "$1" in
            perch-js) echo "@stellar-registry/perch";;
            perch-interpreter-js) echo "@stellar-registry/perch-interpreter";;
          esac; }
          for p in perch-js perch-interpreter-js; do
            next_tag=$(git cliff --config cliff.toml --tag-pattern "$p-v.*" --include-path "packages/$p/**" --bumped-version 2>/dev/null) || true
            next_ver=${next_tag#"$p"-v}
            cur=$(jq -r .version "packages/$p/package.json")
            [ -n "$next_ver" ] || continue
            [ "$next_ver" != "$cur" ] || continue
            [ "$(printf '%s\n%s\n' "$cur" "$next_ver" | sort -V | tail -1)" = "$next_ver" ] || continue
            npm version "$next_ver" --no-git-tag-version --prefix "packages/$p" >/dev/null
            git cliff --config cliff.toml --tag-pattern "$p-v.*" --include-path "packages/$p/**" --bump -o "packages/$p/CHANGELOG.md" 2>/dev/null
            summary="${summary}- \`$p\` (npm \`$(npm_name "$p")\`): $cur -> $next_ver"$'\n'
            echo "bump $p: $cur -> $next_ver"
          done
          if [ -n "$summary" ]; then echo "any=true" >>"$GITHUB_OUTPUT"; else echo "any=false" >>"$GITHUB_OUTPUT"; fi
          {
            echo "body<<__RPBODY__"
            echo "Automated by the \`release-pr\` job (git-cliff) — version bumps + changelogs, no cargo package."
            echo ""
            echo "### Contracts to release"
            printf "%s" "${summary:-_none_}"
            echo ""
            echo ""
            echo "Merging bumps the versions on main; \`detect-releases\` then tags and publishes them."
            echo "__RPBODY__"
          } >>"$GITHUB_OUTPUT"
      - name: Open / update the release PR
        if: steps.prep.outputs.any == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: release/next
          delete-branch: true
          title: "chore: release"
          commit-message: "chore: release — version bumps + changelogs"
          body: ${{ steps.prep.outputs.body }}
      - name: Close the release PR when nothing is pending
        if: steps.prep.outputs.any != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head release/next --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$pr" ]; then gh pr close "$pr" --delete-branch --comment "No releasable changes remain." || true; fi

  # npm mirror of the on-chain publish chains: when detect-releases tags
  # <pkg>-v* (a packages/<pkg> manifest version was bumped in a merged PR),
  # publish that package to the npm registry — one matrix leg per released
  # package. Same release convention as the contracts — bump the version in a
  # PR to release; the release-pr job proposes that bump from conventional
  # commits. Requires the NPM_TOKEN repo secret (an npm automation token that
  # can publish the @stellar-registry scope). If the secret is absent the
  # publish step fails and the job can be re-run after the secret is added —
  # the tag and github.sha are unchanged on a re-run, so it publishes exactly
  # the tagged commit.
  npm-publish:
    needs: detect-releases
    if: >-
      !cancelled() && needs.detect-releases.outputs.npm_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance (sigstore attestation of the CI build)
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.detect-releases.outputs.npm_releases) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.release.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a publish job (zizmor cache-poisoning: nothing a
      # cache write could later inject into a signed publish).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm test
      # prepack builds dist/; publishConfig pins access=public for the scope.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Constructorless contract publishes ────────────────────────────────────
  # The generic, contract-agnostic half: any released infra contract in the
  # ALLOW list (the reusable infra wasms authored by the perch-author-account
  # smart account) is published to unverified/perch/constructorless, perch's
  # one canonical registry (see the header). There is no per-contract workflow
  # code — the set is data (the ALLOW list below, kept in step with the
  # detect-releases CONTRACTS list), and everything else (wasm path, registry
  # name, version) derives from the release tag. Adding a contract is a
  # one-line edit here + a detect-releases CONTRACTS entry + the manager's
  # one-time initial publish of its name (the bootstrap note at the top).
  #
  # This hangs off detect-releases's `releases` output in the SAME run, not a
  # tag/release trigger — so it fires even though tags are pushed with the
  # default GITHUB_TOKEN (no GitHub App required).

  # Which constructorless contracts did THIS run release (or was one passed by
  # hand)? Emit the publish matrix; empty ⇒ publish-constructorless skips.
  publish-plan:
    needs: detect-releases
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '') ||
        (github.event_name == 'push' && needs.detect-releases.outputs.releases_created == 'true')
      )
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    env:
      RELEASES: ${{ needs.detect-releases.outputs.releases }}
      DISPATCH_TAG: ${{ inputs.publish_tag }}
    steps:
      - name: Build the publish matrix
        id: plan
        run: |
          # The canonical infra set. Keep in step with the detect-releases
          # CONTRACTS list. A contract not listed here is tagged but never
          # published to the constructorless registry. Each name needs the
          # manager's one-time initial publish there (the bootstrap note at the
          # top) before its first CI publish can succeed.
          # The recovery stack (perch-recovery, perch-zk-pool,
          # perch-zk-adapter, perch-webauthn-verifier, perch-account-factory)
          # is deliberately NOT in this allow-list: it is tagged/versioned
          # (CONTRACTS above) so its intra-workspace pins stay tracked, but
          # publishing it to the canonical registry is a separate, deliberate
          # decision. Until then scripts/deploy-stack.sh deploys it, in pin
          # order, to its own registry (deployments/testnet.json). Adding
          # these here also needs the manager's one-time initial publish of
          # each new name, and the factory must publish after the account
          # build it pins.
          ALLOW='["perch-interpreter","perch-doc-compiler","perch-ed25519-verifier","perch-spending-limit"]'
          if [ -n "$DISPATCH_TAG" ]; then
            # Strict allow-list regex, not a prefix glob: the tag and the package
            # parsed from it flow into later `run:` shells and perch-deploy args,
            # so anything beyond exact <pkg>-v<semver> shape is rejected.
            if [[ "$DISPATCH_TAG" =~ ^(perch-interpreter|perch-doc-compiler|perch-ed25519-verifier|perch-spending-limit)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              matrix=$(jq -cn \
                --arg p "${BASH_REMATCH[1]}" --arg t "$DISPATCH_TAG" --arg v "${BASH_REMATCH[2]}" \
                '[{package: $p, tag: $t, version: $v}]')
            else
              echo "publish_tag '$DISPATCH_TAG' is not the tag of an ALLOW-listed contract" >&2
              exit 1
            fi
          else
            # releases is [{package_name, tag, version}, …]; keep the allowed set.
            matrix=$(jq -c --argjson allow "$ALLOW" \
              '[.[] | select(.package_name as $p | $allow | index($p)) | {package: .package_name, tag: .tag, version: .version}]' \
              <<<"$RELEASES")
          fi
          n=$(jq length <<<"$matrix")
          {
            echo "matrix={\"include\":$matrix}"
            echo "any=$([ "$n" -gt 0 ] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "no constructorless contracts released this run — nothing to publish"
          else
            echo "publishing: $(jq -r '[.[].tag] | join(", ")' <<<"$matrix")"
          fi

  # Build + attest each released constructorless contract, then publish it to
  # unverified/perch/constructorless — both via the reusable stellar-registry/
  # actions workflows. The publish is authored by the perch-author-account smart
  # account and signed by the CAP-71 delegate CI key (perch-ci); the reusable
  # registry-publish installs the theahaco/stellar-cli fork, which signs
  # smart-account auth by discovering the account's context rule on-chain — no
  # perch-deploy shim, no smart-account flags.

  # Attested build (scaffold build + optimize + GitHub release + provenance).
  # Push-only: the reusable workflow has no ref input and builds this run's sha
  # (the detect-releases-tagged commit); a dispatch republishes the existing asset.
  constructorless-build:
    needs: publish-plan
    if: >-
      !cancelled() && needs.publish-plan.outputs.any == 'true' &&
      github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.publish-plan.outputs.matrix) }}
    permissions:
      id-token: write
      contents: write
      attestations: write
    uses: stellar-registry/actions/.github/workflows/contract-release.yml@470d61ccad7240f496497c66906a03e6540e8405 # main 2026-08
    with:
      package: ${{ matrix.package }}
      release_name: ${{ matrix.tag }}
      release_description: >-
        Attested build of ${{ matrix.package }}, published content-addressed to
        the perch constructorless registry (see the attached publish receipt).
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  # On-chain publish via the reusable registry-publish (upload + smart-account-
  # signed publish_hash + deploy_stateless), authored by the SA. On push it
  # consumes the freshly attested asset; on dispatch it republishes the existing
  # one (build is skipped by design).
  constructorless-publish:
    needs: [publish-plan, constructorless-build]
    if: >-
      !cancelled() && needs.publish-plan.outputs.any == 'true' && (
        needs.constructorless-build.result == 'success' ||
        (github.event_name == 'workflow_dispatch' &&
         needs.constructorless-build.result == 'skipped')
      )
    strategy:
      fail-fast: false
      # One leg at a time: every publish signs with the same CI key, so parallel
      # legs would collide on its source-account sequence number.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.publish-plan.outputs.matrix) }}
    permissions:
      contents: write
      id-token: write # gh attestation verify
    uses: stellar-registry/actions/.github/workflows/registry-publish.yml@fcfebed27b865a8ddfe5439926a13ba9013ccef7 # main 2026-09
    with:
      # The constructorless subregistry (unverified/perch/constructorless) id and
      # the perch-author-account smart account (C…). Repo/testnet vars.
      registry: ${{ vars.PERCH_REGISTRY_CONTRACT_ID }}
      author: ${{ vars.PERCH_AUTHOR_ADDRESS }}
      wasm_name: ${{ matrix.package }}
      version: ${{ matrix.version }}
      release_tag: ${{ matrix.tag }}
      wasm_asset: ${{ matrix.package }}_v${{ matrix.version }}.wasm
      network: testnet
    secrets:
      # perch-ci: the account's ci-publish delegate (also the fee source).
      signing_key: ${{ secrets.CI_PUBLISH_SECRET_KEY }}
      release_token: ${{ secrets.GITHUB_TOKEN }}
