name: Release

# Three chained halves:
#
#   1. `detect-releases` — on every push to main, tag any contract whose crate
#      manifest `version` has no matching `<contract>-v<version>` tag yet (i.e.
#      it was bumped in the merged PR). Releases are ON-CHAIN wasm publishes, not
#      crates.io, so this is pure git — NO release-plz / `cargo package`, which
#      couldn't resolve the workspace's git-only + intra-workspace path deps
#      against the crates.io index and also packaged the immutable last-release
#      tags as its diff baseline, wedging the pipeline. To release a contract,
#      bump its version in a PR.
#   2. The spending-limit chain (`spending-limit-release` → `build-attest` →
#      `publish-stateless`) — when a run of this workflow tags
#      `perch-spending-limit-v*`, build the wasm via the
#      stellar-registry/actions reusable workflow (scaffold build + optimize +
#      GitHub release + stellar.expert validation + GitHub build-provenance
#      attestation), then publish it to the STATELESS registry
#      (content-addressed, salt = wasm_hash) and `deploy_stateless` it,
#      authorized by the CI_PUBLISH_SECRET_KEY author key.
#   3. The constructorless publishes (`publish-plan` → `constructorless-build`
#      → `constructorless-publish`) — a generic, contract-AGNOSTIC fan-out:
#      whichever constructorless contracts this run released (perch-interpreter
#      / perch-doc-compiler / perch-ed25519-verifier) are each built+attested and
#      published to unverified/perch/constructorless via the reusable
#      stellar-registry/actions workflows (contract-release → registry-publish),
#      authored by the perch-author-account smart account and signed by the
#      theahaco/stellar-cli fork (on-chain rule discovery — no perch-deploy).
#      No per-contract code — the set is data (see publish-plan).
#
# Both publish halves hang off `needs:` in the SAME run (gated on the
# detect-releases `releases` output) instead of a tag/release trigger, so they
# fire even though the tag was pushed with the default GITHUB_TOKEN — no GitHub
# App required. (This is why the old per-contract publish.yml, which needed the
# App token's tag push to retrigger, was folded in here and removed.)
#
# ONE-TIME BOOTSTRAP (manager-signed): the stateless registry is MANAGED — the
# manager must approve the INITIAL publish of a new wasm name; that first
# publish also binds the author, and every later version needs only the
# author's own signature. So before the first CI publish can succeed, the
# manager must publish any earlier version with author = the CI key (pubkey of
# CI_PUBLISH_SECRET_KEY). From a machine holding the manager key:
#
#   stellar scaffold build --package perch-spending-limit
#   stellar contract upload --wasm target/stellar/testnet/perch_spending_limit.wasm \
#     --source-account <manager> --network testnet
#   stellar contract invoke --id <stateless-registry> --network testnet \
#     --source-account <manager> -- publish_hash \
#     --wasm_name perch-spending-limit --author <CI-public-key> \
#     --wasm_hash <hash-from-upload> --version 0.0.1
#
# (0.0.1 < the first released version 0.1.0 — versions must be strictly
# increasing.) After that the chain is autonomous: bump a contract's version in
# a merged PR and detect-releases tags + publishes it. Run the bootstrap any
# time after this workflow lands and before the first version bump merges.

on:
  push:
    branches: [main]
  # Recovery path — PUBLISH-ONLY: re-run the on-chain half against the
  # existing, already-attested release asset for the tag (e.g. after a
  # transient RPC failure). It never rebuilds, so it doesn't matter how far
  # main has moved: integrity comes from `gh attestation verify` against the
  # pinned reusable signer workflow, not from git position. If the BUILD half
  # failed instead, use the failed run's native "Re-run failed jobs" (same
  # sha), after deleting the GitHub release if it got as far as creating one
  # (`gh release delete <tag>` — keep the tag).
  workflow_dispatch:
    inputs:
      spending_limit_tag:
        description: "Existing spending-limit tag to (re)publish to the STATELESS registry, e.g. perch-spending-limit-v0.1.0"
        required: false
        type: string
      publish_tag:
        description: "Existing constructorless-contract tag to (re)publish to unverified/perch/constructorless, e.g. perch-interpreter-v0.1.0"
        required: false
        type: string

permissions: {}

# Dispatch recovery runs get their own group: the shared group has ONE pending
# slot, and a push landing while another push run is active would silently
# cancel a queued dispatch (cancel-in-progress only protects the RUNNING run).
# A dispatch racing a push run is on-chain-safe: the fetch_hash preflight
# skips a same-hash republish and refuses a different-hash one, and
# deploy_stateless is idempotent.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-plz-dispatch-{0}{1}', inputs.spending_limit_tag, inputs.publish_tag) || 'release-plz' }}
  cancel-in-progress: false

jobs:
  # Detect which contracts to release — WITHOUT release-plz or `cargo package`.
  # Perch never publishes to crates.io (releases are on-chain wasm publishes), so
  # release-plz's `cargo package --workspace` change-detection was a structural
  # mismatch: the workspace's git-only + intra-workspace path deps can't all
  # resolve on the crates.io index, and release-plz also packages the immutable
  # last-release tags as its diff baseline — commits whose manifests can't be
  # retroactively fixed — which permanently wedged the pipeline. Instead: a
  # contract is "released" when its crate manifest `version` has no matching
  # `<contract>-v<version>` tag yet (i.e. someone bumped it in a merged PR). Pure
  # git, no packaging. Emits the same `releases` shape the publish halves consume,
  # so everything downstream is unchanged.
  detect-releases:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create + push the per-contract tags
    outputs:
      releases_created: ${{ steps.detect.outputs.releases_created }}
      releases: ${{ steps.detect.outputs.releases }}
    steps:
      # Default token + persisted credentials are enough to push a tag. Tags
      # pushed with GITHUB_TOKEN do NOT retrigger workflows, but the publish
      # halves below run via `needs:` in THIS same run, so no retrigger (and no
      # GitHub App) is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0 # full tag history for the version-bump comparison
      - name: Detect released contracts (manifest version bumped past its tag)
        id: detect
        run: |
          set -euo pipefail
          # The release-tracked contracts. To release one, bump its `version` in
          # crates/<contract>/Cargo.toml in a PR; on merge this tags + publishes
          # it. The constructorless allow-list in publish-plan decides which of
          # these actually publish on-chain (the rest just get a tag).
          CONTRACTS="perch-interpreter perch-doc-compiler perch-ed25519-verifier perch-spending-limit perch-account perch-stateless-registry"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          releases='[]'
          for c in $CONTRACTS; do
            ver=$(grep -m1 '^version = "' "crates/$c/Cargo.toml" | sed 's/^version = "\(.*\)"/\1/')
            tag="$c-v$ver"
            # Already released? (tag exists) — skip.
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then continue; fi
            # Guard against a downgrade: never tag a version <= the highest existing tag.
            last=$(git tag -l "$c-v*" | sed "s|^$c-v||" | sort -V | tail -1)
            if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$ver" "$last" | sort -V | tail -1)" != "$ver" ]; then
              echo "::warning::$c manifest version $ver is not greater than last tag $last — skipping"
              continue
            fi
            git tag "$tag"
            git push origin "$tag"
            releases=$(jq -c --arg p "$c" --arg t "$tag" --arg v "$ver" '. + [{package_name:$p, tag:$t, version:$v}]' <<<"$releases")
            echo "released $tag"
          done
          {
            echo "releases=$releases"
            n=$(jq length <<<"$releases")
            echo "releases_created=$([ "$n" -gt 0 ] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### Released this run"
            jq -r 'if length==0 then "_none — no contract version bumped_" else (.[] | "- \(.tag)") end' <<<"$releases"
          } >>"$GITHUB_STEP_SUMMARY"

  # Gate + parameters for the spending-limit chain: did THIS run tag
  # perch-spending-limit (or was a tag passed by hand via dispatch)?
  spending-limit-release:
    needs: detect-releases
    # !cancelled(): on dispatch the detect-releases job is skipped, which would
    # otherwise skip everything downstream of this `needs:`.
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.spending_limit_tag != '') ||
        (needs.detect-releases.outputs.releases_created == 'true' &&
         contains(needs.detect-releases.outputs.releases, '"perch-spending-limit"'))
      )
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.params.outputs.tag }}
      version: ${{ steps.params.outputs.version }}
    env:
      RELEASES: ${{ needs.detect-releases.outputs.releases }}
      DISPATCH_TAG: ${{ inputs.spending_limit_tag }}
    steps:
      - name: Extract tag and version
        id: params
        # Strict allow-list, not a prefix glob: the tag flows into the reusable
        # workflow's release_name input, which that workflow interpolates
        # directly into `run:` shell — any character beyond exact semver shape
        # would be a cross-workflow command injection.
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG=$(jq -r '.[] | select(.package_name == "perch-spending-limit") | .tag' <<<"$RELEASES")
          fi
          if ! [[ "$TAG" =~ ^perch-spending-limit-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected spending-limit tag: '$TAG'" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#perch-spending-limit-v}"
          } >>"$GITHUB_OUTPUT"
  # Build + attest + GitHub release via stellar-registry/actions: scaffold
  # build with source_repo meta, `stellar contract optimize` (preserves the
  # name/binver contractmeta — verified), a GitHub release at the release tag
  # holding perch-spending-limit_v<version>.wasm, the hash submitted to
  # stellar.expert contract-validation, and GitHub build provenance signed for
  # the asset (verified again in publish-stateless before anything goes
  # on-chain). detect-releases deliberately does NOT create this release: the
  # reusable workflow's `gh release create` fails on an existing release.
  #
  # Push-only: the reusable workflow has no ref input — it builds this run's
  # github.sha, which on push IS the commit detect-releases tagged, but on
  # dispatch is wherever main has drifted to. So a dispatch never rebuilds; it
  # republishes the existing attested asset (see the recovery note at the
  # top).
  build-attest:
    needs: spending-limit-release
    if: >-
      !cancelled() &&
      needs.spending-limit-release.result == 'success' &&
      github.event_name == 'push'
    permissions:
      id-token: write
      contents: write
      attestations: write
    uses: stellar-registry/actions/.github/workflows/contract-release.yml@470d61ccad7240f496497c66906a03e6540e8405 # main 2026-08
    with:
      package: perch-spending-limit
      release_name: ${{ needs.spending-limit-release.outputs.tag }}
      release_description: >-
        Attested build of the perch-spending-limit policy contract, published
        content-addressed to the perch stateless registry (see the attached
        publish receipt).
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  # The on-chain half: download the attested release asset, verify its
  # provenance + binver, then publish_hash + deploy_stateless on the stateless
  # registry. The CI key is the bound AUTHOR of the perch-spending-limit wasm
  # name (see the bootstrap note at the top) — author auth is all a
  # subsequent-version publish needs, and deploy_stateless (deployer = the
  # registry itself) needs no auth at all and is idempotent.
  # On push, build-attest must have succeeded; on dispatch it is skipped by
  # design and the existing release asset is republished (its provenance is
  # verified below either way — that check, not git position, is what makes
  # the asset trustworthy).
  publish-stateless:
    needs: [spending-limit-release, build-attest]
    if: >-
      !cancelled() &&
      needs.spending-limit-release.result == 'success' &&
      (needs.build-attest.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.build-attest.result == 'skipped'))
    runs-on: ubuntu-latest
    # mainnet would add required-reviewer protection on the environment (and
    # needs the stateless registry deployed there first); testnet none.
    environment: testnet
    permissions:
      contents: write # gh release download + upload receipt
    env:
      TAG: ${{ needs.spending-limit-release.outputs.tag }}
      VERSION: ${{ needs.spending-limit-release.outputs.version }}
      STELLAR_NETWORK: testnet
      STELLAR_RPC_URL: ${{ vars.STELLAR_RPC_URL || 'https://soroban-testnet.stellar.org' }}
      STELLAR_NETWORK_PASSPHRASE: ${{ vars.STELLAR_NETWORK_PASSPHRASE || 'Test SDF Network ; September 2015' }}
      WASM_NAME: perch-spending-limit
      # Author bound to the wasm name at bootstrap = pubkey of the CI key.
      AUTHOR: ${{ vars.SPENDING_LIMIT_AUTHOR || 'GDCB32GYRIYTZGERRSDRJVXALKR3TYA3W7YXQNXDNHJAOQSMRXBNUYAX' }}
    steps:
      # Checkout for perch-derive-id + the fetch-infra-wasm composite (which
      # resolves the stateless registry id by NAME — nothing hardcoded here).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # No build caches in a publish job (zizmor cache-poisoning: nothing a
      # cache write could later inject into a signed publish).
      - uses: ./.github/actions/fetch-infra-wasm
      - name: Download the attested release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WASM="${WASM_NAME}_v${VERSION}.wasm"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$WASM" --dir dist
          test -s "dist/$WASM" || { echo "release asset $WASM missing" >&2; exit 1; }
          echo "WASM=dist/$WASM" >>"$GITHUB_ENV"
      - name: Verify build provenance
        # The attestation's SIGNER is the reusable workflow we call, not this
        # repo's own workflow — in a reusable-workflow run the certificate's
        # job_workflow_ref points at stellar-registry/actions. Without
        # --signer-workflow, `gh attestation verify --repo <this repo>` finds
        # the attestation but rejects the signer (the v0.1.0 failure:
        # 'Error: verifying with issuer "sigstore.dev"').
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$WASM" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "stellar-registry/actions/.github/workflows/contract-release.yml"
      - name: Cross-check wasm meta binver against the tag
        run: |
          meta_binver=$(stellar contract info meta --wasm "$WASM" | sed -n 's/^ • binver: \(.*\)$/\1/p')
          if [ "$meta_binver" != "$VERSION" ]; then
            echo "tag version $VERSION != wasm meta binver $meta_binver" >&2
            exit 1
          fi
      - name: Publish to the stateless registry
        env:
          # stellar-cli reads the signing source account from STELLAR_ACCOUNT
          # (accepts a raw S... seed) — the key never appears in argv.
          STELLAR_ACCOUNT: ${{ secrets.CI_PUBLISH_SECRET_KEY }}
        run: |
          REGISTRY=$(cat crates/perch-smart-account/wasm/stateless.id)
          echo "REGISTRY=$REGISTRY" >>"$GITHUB_ENV"
          LOCAL_HASH=$(sha256sum "$WASM" | cut -d' ' -f1)
          echo "LOCAL_HASH=$LOCAL_HASH" >>"$GITHUB_ENV"

          # Idempotency preflight (same shape as perch-deploy publish): if this
          # exact version is already on-chain with the same hash, skip the
          # publish; a different hash under the same version is a supply-chain
          # smell and refuses. Registry errors #1 NoSuchWasmPublished and
          # #2 NoSuchVersion mean "not published yet" and proceed.
          # fetch_hash's version is Option<String>: the CLI parses Option args
          # as JSON, so the value must be a JSON string ("0.1.0", quotes and
          # all) — bare 0.1.0 is rejected as invalid JSON before simulation.
          set +e
          onchain=$(stellar contract invoke --id "$REGISTRY" --network "$STELLAR_NETWORK" -- \
            fetch_hash --wasm_name "$WASM_NAME" --version "\"$VERSION\"" 2>preflight.err)
          rc=$?
          set -e
          onchain=${onchain//\"/}
          if [ "$rc" -eq 0 ]; then
            if [ "$onchain" = "$LOCAL_HASH" ]; then
              echo "version $VERSION already published with the same hash — skipping publish"
              exit 0
            fi
            echo "version $VERSION already on-chain with DIFFERENT hash $onchain (local $LOCAL_HASH)" >&2
            exit 1
          elif ! grep -qE 'Error\(Contract, #(1|2)\)' preflight.err; then
            echo "unexpected preflight failure:" >&2
            cat preflight.err >&2
            exit 1
          fi

          # Upload prints the ledger wasm hash = sha256 of the bytes; assert it
          # matches the attested asset before binding name+version to it.
          uploaded=$(stellar contract upload --wasm "$WASM" --network "$STELLAR_NETWORK")
          if [ "$uploaded" != "$LOCAL_HASH" ]; then
            echo "uploaded hash $uploaded != local hash $LOCAL_HASH" >&2
            exit 1
          fi
          stellar contract invoke --id "$REGISTRY" --network "$STELLAR_NETWORK" -- \
            publish_hash --wasm_name "$WASM_NAME" --author "$AUTHOR" \
            --wasm_hash "$LOCAL_HASH" --version "$VERSION"
      - name: Deploy the content-addressed instance
        env:
          STELLAR_ACCOUNT: ${{ secrets.CI_PUBLISH_SECRET_KEY }}
        run: |
          # deployer = the registry itself → address is the pure function
          # deployer(registry, wasm_hash); a redeploy of identical bytes is a
          # no-op returning the same address. version is Option<String> → JSON
          # string, same as the preflight.
          addr=$(stellar contract invoke --id "$REGISTRY" --network "$STELLAR_NETWORK" -- \
            deploy_stateless --wasm_name "$WASM_NAME" --version "\"$VERSION\"")
          CONTRACT_ID=${addr//\"/}
          echo "CONTRACT_ID=$CONTRACT_ID" >>"$GITHUB_ENV"
      - name: Attach the publish receipt to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg registry "$REGISTRY" \
            --arg wasm_name "$WASM_NAME" \
            --arg version "$VERSION" \
            --arg wasm_hash "$LOCAL_HASH" \
            --arg contract_id "$CONTRACT_ID" \
            --arg network "$STELLAR_NETWORK" \
            '$ARGS.named' >publish-receipt.json
          gh release upload "$TAG" publish-receipt.json --clobber \
            --repo "$GITHUB_REPOSITORY"
          {
            echo "### perch-spending-limit $VERSION published"
            echo '```json'
            cat publish-receipt.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # ── Constructorless contract publishes ────────────────────────────────────
  # The generic, contract-agnostic half: any released CONSTRUCTORLESS contract
  # (the reusable infra wasms authored by the perch-author-account smart
  # account) is published to unverified/perch/constructorless. There is no
  # per-contract workflow code — the set is data (the ALLOW list below, kept in
  # step with the detect-releases CONTRACTS list), and everything else (wasm
  # path, registry name, version) derives from the release tag. Adding a
  # contract is a one-line edit here + a detect-releases CONTRACTS entry.
  #
  # Like the spending-limit chain this hangs off detect-releases's `releases` output
  # in the SAME run, not a tag/release trigger — so it fires even though tags are
  # pushed with the default GITHUB_TOKEN (no GitHub App required).

  # Which constructorless contracts did THIS run release (or was one passed by
  # hand)? Emit the publish matrix; empty ⇒ publish-constructorless skips.
  publish-plan:
    needs: detect-releases
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '') ||
        (github.event_name == 'push' && needs.detect-releases.outputs.releases_created == 'true')
      )
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    env:
      RELEASES: ${{ needs.detect-releases.outputs.releases }}
      DISPATCH_TAG: ${{ inputs.publish_tag }}
    steps:
      - name: Build the publish matrix
        id: plan
        run: |
          # The constructorless set. Keep in step with the detect-releases
          # CONTRACTS list. A contract not listed here is tagged but never
          # published to the constructorless registry.
          ALLOW='["perch-interpreter","perch-doc-compiler","perch-ed25519-verifier"]'
          if [ -n "$DISPATCH_TAG" ]; then
            # Strict allow-list regex, not a prefix glob: the tag and the package
            # parsed from it flow into later `run:` shells and perch-deploy args,
            # so anything beyond exact <pkg>-v<semver> shape is rejected.
            if [[ "$DISPATCH_TAG" =~ ^(perch-interpreter|perch-doc-compiler|perch-ed25519-verifier)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              matrix=$(jq -cn \
                --arg p "${BASH_REMATCH[1]}" --arg t "$DISPATCH_TAG" --arg v "${BASH_REMATCH[2]}" \
                '[{package: $p, tag: $t, version: $v}]')
            else
              echo "publish_tag '$DISPATCH_TAG' is not a constructorless contract tag" >&2
              exit 1
            fi
          else
            # releases is [{package_name, tag, version}, …]; keep the allowed set.
            matrix=$(jq -c --argjson allow "$ALLOW" \
              '[.[] | select(.package_name as $p | $allow | index($p)) | {package: .package_name, tag: .tag, version: .version}]' \
              <<<"$RELEASES")
          fi
          n=$(jq length <<<"$matrix")
          {
            echo "matrix={\"include\":$matrix}"
            echo "any=$([ "$n" -gt 0 ] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "no constructorless contracts released this run — nothing to publish"
          else
            echo "publishing: $(jq -r '[.[].tag] | join(", ")' <<<"$matrix")"
          fi

  # Build + attest each released constructorless contract, then publish it to
  # unverified/perch/constructorless — both via the reusable stellar-registry/
  # actions workflows. The publish is authored by the perch-author-account smart
  # account and signed by the CAP-71 delegate CI key (perch-ci); the reusable
  # registry-publish installs the theahaco/stellar-cli fork, which signs
  # smart-account auth by discovering the account's context rule on-chain — no
  # perch-deploy shim, no smart-account flags.

  # Attested build (scaffold build + optimize + GitHub release + provenance).
  # Push-only: the reusable workflow has no ref input and builds this run's sha
  # (the detect-releases-tagged commit); a dispatch republishes the existing asset.
  constructorless-build:
    needs: publish-plan
    if: >-
      !cancelled() && needs.publish-plan.outputs.any == 'true' &&
      github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.publish-plan.outputs.matrix) }}
    permissions:
      id-token: write
      contents: write
      attestations: write
    uses: stellar-registry/actions/.github/workflows/contract-release.yml@470d61ccad7240f496497c66906a03e6540e8405 # main 2026-08
    with:
      package: ${{ matrix.package }}
      release_name: ${{ matrix.tag }}
      release_description: >-
        Attested build of ${{ matrix.package }}, published content-addressed to
        the perch constructorless registry (see the attached publish receipt).
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  # On-chain publish via the reusable registry-publish (upload + smart-account-
  # signed publish_hash + deploy_stateless), authored by the SA. On push it
  # consumes the freshly attested asset; on dispatch it republishes the existing
  # one (build is skipped by design).
  constructorless-publish:
    needs: [publish-plan, constructorless-build]
    if: >-
      !cancelled() && needs.publish-plan.outputs.any == 'true' && (
        needs.constructorless-build.result == 'success' ||
        (github.event_name == 'workflow_dispatch' &&
         needs.constructorless-build.result == 'skipped')
      )
    strategy:
      fail-fast: false
      # One leg at a time: every publish signs with the same CI key, so parallel
      # legs would collide on its source-account sequence number.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.publish-plan.outputs.matrix) }}
    permissions:
      contents: write
      id-token: write # gh attestation verify
    uses: stellar-registry/actions/.github/workflows/registry-publish.yml@fcfebed27b865a8ddfe5439926a13ba9013ccef7 # main 2026-09
    with:
      # The constructorless subregistry (unverified/perch/constructorless) id and
      # the perch-author-account smart account (C…). Repo/testnet vars.
      registry: ${{ vars.PERCH_REGISTRY_CONTRACT_ID }}
      author: ${{ vars.PERCH_AUTHOR_ADDRESS }}
      wasm_name: ${{ matrix.package }}
      version: ${{ matrix.version }}
      release_tag: ${{ matrix.tag }}
      wasm_asset: ${{ matrix.package }}_v${{ matrix.version }}.wasm
      network: testnet
    secrets:
      # perch-ci: the account's ci-publish delegate (also the fee source).
      signing_key: ${{ secrets.CI_PUBLISH_SECRET_KEY }}
      release_token: ${{ secrets.GITHUB_TOKEN }}
