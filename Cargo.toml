[workspace]
resolver = "2"
members = [
    "crates/perch-ir",
    "crates/perch-schema",
    "crates/perch-program",
    "crates/perch-interpreter",
    "crates/perch-compile",
    "crates/perch-bench-rpn",
    "crates/perch-bench",
    "crates/integration-tests",
    "crates/perch-golden",
    "crates/perch-conformance",
    "crates/perch-analyze",
    "crates/perch-ed25519-verifier",
    "crates/perch-mldsa-verifier",
    "crates/perch-spending-limit",
    "crates/perch-doc-compiler",
    "crates/perch-smart-account",
    "crates/perch-account",
    "crates/perch-deploy",
    "crates/perch-derive-id",
    "crates/perch-constructorless-registry",
    "crates/perch-registry-resolve-macro",
    "crates/perch-registry-resolve",
    "crates/perch-testkit",
    "crates/perch-recovery",
    "crates/perch-recovery-interface",
    "crates/perch-zk-primitives",
    "crates/perch-zk-pool",
    "crates/perch-zk-prover",
    "crates/perch-zk-adapter",
    "crates/perch-webauthn-verifier",
    "crates/perch-account-factory",
    "crates/perch-testnet",
    "crates/perch-rule-eval",
    "crates/perch-account-types",
]
# Vendored third-party source, built only as a path dependency: not linted,
# tested, or released with the workspace. See vendor/*/NOTICE.
exclude = ["vendor"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/stellar-registry/perch"

[workspace.dependencies]
soroban-sdk = "29.0.1"
# scerr (sequentially-coded contract errors) + typed storage handles.
# Vendored at 0.1.4, moved to soroban-sdk 29 (vendor/soroban-sdk-tools/NOTICE).
soroban-sdk-tools = { version = "0.1.4", path = "vendor/soroban-sdk-tools" }
# TEMPORARY dogfood pin: theahaco's OZ fork at the CAP-0071 patch
# (theahaco/stellar-contracts-OZ PR #3, branch cap-71-delegate-auth) —
# Signer::Delegated authenticates via delegate_account_auth (protocol 27,
# single AddressWithDelegates auth entry) instead of a separate
# require_auth_for_args entry per delegate — plus its PR #4 (`*_no_events`
# variants of every rule, signer, and policy mutation: apply_doc emits one
# DocApplied instead) and PR #5 (`reconcile_signers[_no_events]`, one call
# per in-place signer change), stacked on cap-71-delegate-auth at 3372676.
# Pinned to bitswell-hq/theahaco__stellar-contracts-OZ, a fork of that fork
# whose fm/oz-quiet-events-x1-reconcile branch adds the move to soroban-sdk
# 29.0.1 on top of 3372676 (its PR #1). Re-pin to upstream
# OpenZeppelin/stellar-contracts once these patches land there.
stellar-accounts = { version = "0.7.1", git = "https://github.com/bitswell-hq/theahaco__stellar-contracts-OZ.git", rev = "42089fc90684fdab33a85eac3e8311259b69a61b", package = "stellar-accounts" }

# rule-core (bitswell/soroban-rule-core): the rule-set evaluator and document
# lowering proven against its Lean model (rule-eval), the Soroban value and
# context reading for contract shells (soroban-facade), and the conformance
# runner whose vectors the model generates (rule-eval-conformance, tests
# only). All three at one rev, so that rev is the only place the vectors are
# pinned. soroban-facade pins soroban-sdk exactly (=29.0.1), so moving
# Perch's SDK first needs a rule-core rev that moves it.
rule-eval = { git = "https://github.com/bitswell/soroban-rule-core", rev = "fe16e21bb6f145b031c50f60a12b8188d341fc25" }
soroban-facade = { git = "https://github.com/bitswell/soroban-rule-core", rev = "fe16e21bb6f145b031c50f60a12b8188d341fc25" }
rule-eval-conformance = { git = "https://github.com/bitswell/soroban-rule-core", rev = "fe16e21bb6f145b031c50f60a12b8188d341fc25" }

perch-ir = { version = "0.1.1", path = "crates/perch-ir" }
perch-program = { version = "0.1.1", path = "crates/perch-program" }

# Flux refinement-type bridge (attrs erase to no-ops on stable; verification
# runs via `just flux` under flux's pinned nightly). Vendored from the
# crates.io release of nidohq/soroban-flux 0.1.0 (its COMPATIBILITY.md pins
# the matching flux toolchain rev), moved to soroban-sdk 29
# (vendor/soroban-flux/NOTICE).
soroban-flux = { version = "0.1.0", path = "vendor/soroban-flux" }

# ML-DSA (FIPS 204) verification in guest wasm, for perch-mldsa-verifier: pure
# Rust, no_std, no allocation. Unaudited. Verification needs no randomness, so
# the OS RNG feature stays off; only the ML-DSA-65 parameter set is compiled.
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-65"] }

# Poseidon2 on the Soroban host (`poseidon2_permutation` host function). Must
# stay byte-identical to noir-lang/poseidon v0.2.0, which the recovery circuit
# uses: crates/perch-zk-primitives pins both sides to shared vectors. Vendored
# at 28.0.0, moved to soroban-sdk 29 (vendor/soroban-poseidon/NOTICE).
soroban-poseidon = { version = "28.0.0", path = "vendor/soroban-poseidon" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
