[workspace]
resolver = "2"
members = [
    "crates/perch-ir",
    "crates/perch-program",
    "crates/perch-interpreter",
    "crates/perch-compile",
    "crates/perch-bench-rpn",
    "crates/perch-bench",
    "crates/integration-tests",
    "crates/perch-golden",
    "crates/perch-conformance",
    "crates/perch-analyze",
    "crates/perch-ed25519-verifier",
    "crates/perch-spending-limit",
    "crates/perch-doc-compiler",
    "crates/perch-smart-account",
    "crates/perch-account",
    "crates/perch-deploy",
    "crates/perch-derive-id",
    "crates/perch-stateless-registry",
    "crates/perch-registry-resolve-macro",
    "crates/perch-registry-resolve",
    "crates/perch-testkit",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/stellar-registry/perch"

[workspace.dependencies]
soroban-sdk = "27.0.2"
# scerr (sequentially-coded contract errors) + typed storage handles.
soroban-sdk-tools = "0.1.3"
# TEMPORARY dogfood pin: theahaco's OZ fork at the CAP-0071 patch
# (theahaco/stellar-contracts-OZ PR #3, branch cap-71-delegate-auth) —
# Signer::Delegated authenticates via delegate_account_auth (protocol 27,
# single AddressWithDelegates auth entry) instead of a separate
# require_auth_for_args entry per delegate. Fork main == upstream fbfde38.
# Re-pin to upstream OpenZeppelin/stellar-contracts once the patch lands there.
stellar-accounts = { version = "0.7.1", git = "https://github.com/theahaco/stellar-contracts-OZ.git", rev = "82002206b1da48167091f33fe2ecfc97ce915857", package = "stellar-accounts" }

perch-ir = { version = "0.1.1", path = "crates/perch-ir" }
perch-program = { version = "0.1.1", path = "crates/perch-program" }

# Flux refinement-type bridge (attrs erase to no-ops on stable; verification
# runs via `just flux` under flux's pinned nightly). Published to crates.io
# from nidohq/soroban-flux (its COMPATIBILITY.md pins the matching flux
# toolchain rev). A crates.io release — NOT a git dep — because release-plz
# runs `cargo package` across the whole workspace to compute version bumps,
# and cargo package can only resolve deps that exist on the index; a git-only
# soroban-flux blocked the entire release pipeline. 0.1.0 was cut from the
# same source the git rev pinned, so builds stay byte-identical.
soroban-flux = "0.1.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
