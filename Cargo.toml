[workspace]
resolver = "2"
members = [
    "crates/perch-ir",
    "crates/perch-program",
    "crates/perch-interpreter",
    "crates/perch-compile",
    "crates/perch-bench-rpn",
    "crates/perch-bench",
    "crates/integration-tests",
    "crates/perch-golden",
    "crates/perch-ed25519-verifier",
    "crates/perch-account",
    "crates/perch-deploy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/stellar-registry/perch"

[workspace.dependencies]
soroban-sdk = "27.0.2"
# TEMPORARY dogfood pin: theahaco's OZ fork at the CAP-0071 patch
# (theahaco/stellar-contracts-OZ PR #3, branch cap-71-delegate-auth) —
# Signer::Delegated authenticates via delegate_account_auth (protocol 27,
# single AddressWithDelegates auth entry) instead of a separate
# require_auth_for_args entry per delegate. Fork main == upstream fbfde38.
# Re-pin to upstream OpenZeppelin/stellar-contracts once the patch lands there.
stellar-accounts = { git = "https://github.com/theahaco/stellar-contracts-OZ.git", rev = "82002206b1da48167091f33fe2ecfc97ce915857", package = "stellar-accounts" }

perch-ir = { path = "crates/perch-ir" }
perch-program = { path = "crates/perch-program" }

# Flux refinement-type bridge (attrs erase to no-ops on stable; verification
# runs via `just flux` under flux's pinned nightly). Rev tracks
# nidohq/soroban-flux main (this rev carries the soroban-sdk 26–27 compat
# range); its COMPATIBILITY.md pins the matching flux toolchain rev.
soroban-flux = { git = "https://github.com/nidohq/soroban-flux.git", rev = "3170467" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
