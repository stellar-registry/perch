[package]
name = "perch-integration-tests"
description = "End-to-end tests: compile → install → do_check_auth against real stellar-accounts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
doctest = false

[dev-dependencies]
perch-ir = { workspace = true }
perch-program = { workspace = true }
perch-compile = { version = "0.1.1", path = "../perch-compile" }
perch-interpreter = { version = "0.1.3", path = "../perch-interpreter" }
perch-account = { version = "0.3.1", path = "../perch-account" }
perch-smart-account = { version = "0.1.1", path = "../perch-smart-account" }
perch-doc-compiler = { version = "0.3.1", path = "../perch-doc-compiler", features = ["testutils"] }
perch-ed25519-verifier = { version = "0.1.2", path = "../perch-ed25519-verifier" }
perch-spending-limit = { version = "0.1.2", path = "../perch-spending-limit" }
perch-testkit = { version = "0.1.1", path = "../perch-testkit" }
perch-registry-resolve = { version = "0.1.1", path = "../perch-registry-resolve" }
perch-recovery = { version = "0.1.1", path = "../perch-recovery" }
perch-recovery-interface = { version = "0.1.0", path = "../perch-recovery-interface" }
perch-zk-pool = { version = "0.1.1", path = "../perch-zk-pool" }
arbitrary = "1"
proptest = "1"
perch-zk-primitives = { version = "0.1.0", path = "../perch-zk-primitives" }
perch-zk-prover = { version = "0.1.0", path = "../perch-zk-prover" }
perch-account-factory = { version = "0.1.1", path = "../perch-account-factory" }
sha2 = "0.10"
stellar-accounts = { workspace = true }
soroban-sdk = { workspace = true, features = ["testutils"] }
# `e2e_invoke` (simulation in recording mode) for release_stack.rs's footprint
# check; the same version soroban-sdk pins.
soroban-env-host = { version = "=27.0.1", features = ["recording_mode"] }
ed25519-dalek = "2"
hex = "0.4"
serde_json = "1"
