[package]
name = "perch-integration-tests"
description = "End-to-end tests: compile → install → do_check_auth against real stellar-accounts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
doctest = false

[dev-dependencies]
perch-ir = { workspace = true }
perch-program = { workspace = true }
perch-compile = { version = "0.1.1", path = "../perch-compile" }
perch-interpreter = { version = "0.1.1", path = "../perch-interpreter" }
perch-account = { version = "0.1.1", path = "../perch-account" }
perch-smart-account = { version = "0.1.1", path = "../perch-smart-account" }
perch-doc-compiler = { version = "0.1.1", path = "../perch-doc-compiler" }
perch-ed25519-verifier = { version = "0.1.1", path = "../perch-ed25519-verifier" }
perch-spending-limit = { version = "0.1.1", path = "../perch-spending-limit" }
perch-testkit = { version = "0.1.1", path = "../perch-testkit" }
perch-registry-resolve = { version = "0.1.1", path = "../perch-registry-resolve" }
stellar-accounts = { workspace = true }
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "2"
hex = "0.4"
