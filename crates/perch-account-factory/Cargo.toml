[package]
name = "perch-account-factory"
description = "Constructorless, immutable factory that deploys perch accounts of one build-time-pinned wasm, at addresses bound to their admin signers"
version = "0.3.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
# The account's `Signer`, which `create` takes.
perch-account-types = { version = "0.1.0", path = "../perch-account-types" }
# Build-time pins: the account wasm hash and the WebAuthn verifier's
# content address, both from this crate's committed `wasm/` pins.
perch-registry-resolve = { version = "0.1.1", path = "../perch-registry-resolve" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
perch-account = { version = "0.5.1", path = "../perch-account" }
perch-doc-compiler = { version = "0.3.5", path = "../perch-doc-compiler" }
perch-interpreter = { version = "0.1.6", path = "../perch-interpreter" }
perch-smart-account = { version = "0.1.1", path = "../perch-smart-account" }
perch-spending-limit = { version = "0.1.4", path = "../perch-spending-limit" }
perch-testkit = { version = "0.1.1", path = "../perch-testkit" }
perch-webauthn-verifier = { version = "0.1.2", path = "../perch-webauthn-verifier" }
