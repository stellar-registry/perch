[package]
name = "perch-account"
description = "Deployable Perch smart account governed by perch policies; admin for the perch registry"
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
perch-smart-account = { version = "0.1.1", path = "../perch-smart-account" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
