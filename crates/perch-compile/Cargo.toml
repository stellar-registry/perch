[package]
name = "perch-compile"
description = "Lowering: PolicyDoc → executable plan of OZ context-rule calls"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Direct path (not `workspace = true`) so `default-features = false` is honored —
# cargo ignores it on workspace-inherited deps. Keeps perch-ir no_std here.
perch-ir = { path = "../perch-ir", default-features = false }
perch-program = { workspace = true }
soroban-sdk = { workspace = true }

[features]
default = ["std"]
std = ["perch-ir/std"]

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
