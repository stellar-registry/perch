[package]
name = "perch-constructorless-registry"
description = "Managed constructorless subregistry: content-addressed deploy (salt = wasm_hash, no constructor arguments). Composed from the imported registry contracttraits."
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# `alloc` enables soroban's bump allocator on wasm — the registry contracttraits
# parse names / upload wasm bytes on-chain.
soroban-sdk = { workspace = true, features = ["alloc"] }

# The importable registry contracttraits (crate `registry-traits`, from the
# unmerged stellar-registry/contracts PR #33), vendored and moved to
# soroban-sdk 29 (vendor/registry-traits/NOTICE). `default-features` (`alloc`)
# are what the trait bodies need (name parsing / wasm upload on-chain).
# Optional + gated behind `contract` so `--no-default-features` yields an
# empty library. Tracked in perch#37.
registry-traits = { version = "0.1.0", path = "../../vendor/registry-traits", optional = true }

# admin-sep ships the real `Administratable`/`Upgradable` `#[contracttrait]`s
# that the canonical `registry` contract composes. It stores the admin at the
# same instance key — `symbol_short!("ADMIN")` (`admin_sep::STORAGE_KEY`) —
# that `registry-traits`' internal auth reads
# (`registry_traits::admin::ADMIN_KEY`, documented as byte-identical), so the
# two interoperate on a single admin key. Vendored at 0.28.1, moved to
# soroban-sdk 29 (vendor/admin-sep/NOTICE). Optional + gated behind `contract`
# for the same reason as above.
admin-sep = { version = "0.28.1", path = "../../vendor/admin-sep", optional = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
# Mirrors the perch-doc-compiler template: the deployable contract lives behind
# `contract`, on by default. `contract` pulls in `registry-traits` + `admin-sep`
# and gates the composition module. `--no-default-features` builds an empty
# library.
default = ["contract"]
contract = ["dep:registry-traits", "dep:admin-sep"]
