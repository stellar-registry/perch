[package]
name = "perch-deploy"
description = "Deploy/CI tool: signs OZ smart-account auth entries for rule install and registry publish"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
perch-ir = { workspace = true }
# `compose`: the rule-eval rules a document lowers to on an account, through
# the account's own conversions (`model_of`, soroban-facade, `rule_eval::lower`).
perch-rule-eval = { version = "0.1.0", path = "../perch-rule-eval", features = ["ir"] }
rule-eval = { workspace = true }
# testutils in a host bin: `Env::default()` is the only way to get an Env for
# the model and ToXdr off-chain, and the sdk gates it behind this feature.
soroban-sdk = { workspace = true, features = ["testutils"] }
# Pinned to the exact version soroban-env-common pins (`=28.0.0`) so there is
# ONE stellar-xdr in the build and `soroban_sdk::xdr` types unify with ours.
# (Since 27.x the crate is flat: no `curr` feature/module — types live at the root.)
stellar-xdr = { version = "=28.0.0", features = ["base64", "serde", "serde_json"] }
# The version stellar-xdr itself uses — no second strkey impl in the tree.
stellar-strkey = "=0.0.16"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", features = ["json"] }
anyhow = "1"

[dev-dependencies]
stellar-accounts = { workspace = true }
perch-ed25519-verifier = { version = "10.0.2", path = "../perch-ed25519-verifier" }
