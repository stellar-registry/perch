[package]
name = "perch-derive-id"
description = "Offline: derive content-addressed (salt = wasm hash) and name-salted registry contract ids for the deploy and fetch scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "perch-derive-id"
path = "src/main.rs"

[dependencies]
# testutils gives a std `Env` whose `deployer().deployed_address()` is the exact
# on-chain contract-id derivation, so the derived ids match the chain.
soroban-sdk = { workspace = true, features = ["testutils"] }
