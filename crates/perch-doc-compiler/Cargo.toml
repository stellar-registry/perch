[package]
name = "perch-doc-compiler"
description = "Stateless deployable: PolicyDoc JSON → compiled rules + canonical doc_hash, on-chain"
version = "0.3.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
# No cargo-manifest `publish = false`: release-plz's `release` command skips
# manifest-unpublishable packages (no tag ever — the missing-4-tags bug of the
# v0.1.0 release). crates.io publish is blocked workspace-wide in
# release-plz.toml instead.

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# "alloc" enables soroban's bump allocator on wasm — compile_doc parses the
# policy-document JSON on-chain (perch-ir is no_std + alloc).
soroban-sdk = { workspace = true, features = ["alloc"] }
soroban-sdk-tools = { workspace = true }
perch-account-types = { version = "0.1.0", path = "../perch-account-types" }
# The compiled recovery wire types and the replacement set `derive_target`
# takes. A plain library (no contract), so no deployable pins another.
perch-recovery-interface = { version = "0.1.0", path = "../perch-recovery-interface" }
# Direct paths (not `workspace = true`) so `default-features = false` is
# honored — cargo ignores it on workspace-inherited deps. Keeps it no_std.
perch-ir = { version = "0.1.1", path = "../perch-ir", default-features = false, optional = true }
# `CompiledModel`, the document model a `CompiledDoc` carries for the
# account's rule-eval lowering, and (with `ir`, under `contract`) `model_of`,
# which builds it. No lowering or evaluator code is linked: the account
# lowers.
perch-rule-eval = { version = "0.1.0", path = "../perch-rule-eval" }
# Spells a recovery replacement's key and ZK enrollment as the lowercase hex
# the document schema uses (see `derive_target`).
hex = { version = "0.4", default-features = false, features = ["alloc"], optional = true }
# Derives the `perch/verifiers` registry a `verifier-name` resolves in, from
# `wasm/verifiers.path` at build time.
perch-registry-resolve = { version = "0.1.1", path = "../perch-registry-resolve", optional = true }

[features]
# The deployable contract + its parser deps. Consumers that only
# need the wire types and DocCompilerClient (i.e. smart accounts) disable
# this so their wasm links no compiler code.
default = ["contract"]
contract = ["dep:perch-ir", "dep:hex", "dep:perch-registry-resolve", "perch-rule-eval/ir"]
# Test-only compilers with other document identities (`testutils` module).
# Never enabled by a deployable.
testutils = ["contract"]
