[package]
name = "perch-doc-compiler"
description = "Stateless deployable: PolicyDoc JSON → compiled rules + canonical doc_hash, on-chain"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
# No cargo-manifest `publish = false`: release-plz's `release` command skips
# manifest-unpublishable packages (no tag ever — the missing-4-tags bug of the
# v0.1.0 release). crates.io publish is blocked workspace-wide in
# release-plz.toml instead.

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# "alloc" enables soroban's bump allocator on wasm — compile_doc parses the
# policy-document JSON on-chain (perch-ir is no_std + alloc).
soroban-sdk = { workspace = true, features = ["alloc"] }
soroban-sdk-tools = { workspace = true }
stellar-accounts = { workspace = true }
perch-program = { workspace = true }
# Direct paths (not `workspace = true`) so `default-features = false` is
# honored — cargo ignores it on workspace-inherited deps. Keeps both no_std.
perch-ir = { version = "0.1.1", path = "../perch-ir", default-features = false, optional = true }
perch-compile = { version = "0.1.1", path = "../perch-compile", default-features = false, optional = true }

[features]
# The deployable contract + its parser/compiler deps. Consumers that only
# need the wire types and DocCompilerClient (i.e. smart accounts) disable
# this so their wasm links no compiler code.
default = ["contract"]
contract = ["dep:perch-ir", "dep:perch-compile"]
