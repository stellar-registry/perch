[package]
name = "perch-plan-cli"
description = "Compile a PolicyDoc to a deployable Plan: emit InstallParams as XDR for off-chain appliers (TS deploy scripts, testnet wiring)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "perch-plan"
path = "src/main.rs"

[dependencies]
perch-ir = { workspace = true }
perch-compile = { path = "../perch-compile" }
# testutils gives a native Env — the compiler materializes SDK value handles
# (Vec<Op>, BytesN) that we then serialize to XDR for the off-chain applier.
soroban-sdk = { workspace = true, features = ["testutils"] }
serde_json = "1.0"
hex = "0.4"
