[package]
name = "perch-recovery"
description = "Deployable account-recovery controller: guardian/ZK/combined recovery under Loss and Protected profiles, as an OZ smart-account Policy"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
# No cargo-manifest `publish = false`: release-plz's `release` command skips
# manifest-unpublishable packages (no tag ever). crates.io publish is blocked
# workspace-wide in release-plz.toml instead.

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
soroban-sdk-tools = { workspace = true }
stellar-accounts = { workspace = true }
# The statement, the compiled configuration, the hook/adapter/pool/account
# clients, and the controller's error codes. A plain library, so the
# controller and the account agree without either linking the other.
perch-recovery-interface = { version = "0.1.0", path = "../perch-recovery-interface" }
# Client and wire types only (`contract` off): the controller calls the
# account's own pinned compiler for `derive_target` and `compile_doc`.
perch-doc-compiler = { version = "0.3.1", path = "../perch-doc-compiler", default-features = false }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
