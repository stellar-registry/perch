[package]
name = "perch-registry-resolve-macro"
description = "Proc-macro backing perch-registry-resolve: registry_contract! address derivation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# `wasm_file:` mode hashes the wasm at macro-expansion time (build time) — the
# same sha256 the registry stores as the content-address salt.
sha2 = "0.10"
