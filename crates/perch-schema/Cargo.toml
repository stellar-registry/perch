[package]
name = "perch-schema"
description = "Host-side generator for the versioned PolicyDoc JSON Schema (draft 2020-12), derived from perch-ir's constants"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Host-only tooling: this crate is never a dependency of any deployable
# contract, so nothing it pulls in (serde_json, and the jsonschema validator
# used only by its tests) can reach a wasm build. perch-ir stays serde-free and
# float-free; this generator reads its public constants off-chain and emits the
# schema. See docs/schema.md "What stays off the contract Wasm build".

[lib]
doctest = false

[[bin]]
name = "perch-schema-gen"
path = "src/bin/perch-schema-gen.rs"

[dependencies]
# std build (the workspace path dep's default features): the generator reads
# perch-ir's public limit constants (MAX_SIGNER_KEY_LEN, ACK_SENTINEL) and its
# shape checks, so the schema and the validator cannot silently diverge.
perch-ir = { workspace = true }
# The compiler's per-document caps (MAX_DOC_SIGNERS, MAX_DOC_RULES,
# MAX_RULE_NAME_BYTES) are plain `pub const u32`s; the generator reads them so
# the schema's maxItems/maxLength track the one place the compiler declares
# them. `default-features = false` drops the on-chain parser/compiler
# (perch-ir/perch-compile/hex, all gated behind the crate's `contract`
# feature) — only the non-wasm constants and wire-type module are pulled in.
# A direct path dep (not `workspace = true`) so that `default-features = false`
# is honored. Host-only: perch-schema is in no contract's build graph, so this
# adds nothing to any wasm build (criterion 5).
perch-doc-compiler = { version = "0.3.2", path = "../perch-doc-compiler", default-features = false }
# Host-only JSON assembly. Its default Map is a sorted BTreeMap, so the emitted
# schema is byte-deterministic regardless of assembly order (the drift check
# relies on this).
serde_json = "1"

[dev-dependencies]
# A real draft 2020-12 validator, for the conformance suite that compares the
# schema's accept/reject against perch-ir's own parser + validator. Tests only;
# never on any ship path. default-features off drops the remote-$ref HTTP stack
# (reqwest/tokio/hyper): every $ref in this schema is local (#/$defs/...).
jsonschema = { version = "0.26", default-features = false }
perch-ir = { workspace = true }
# The parity tests assert the schema's caps equal the compiler's constants
# directly (an integration test is a separate crate, so it needs its own view
# of the constant). Same host-only, default-features-off dep as above.
perch-doc-compiler = { version = "0.3.2", path = "../perch-doc-compiler", default-features = false }
