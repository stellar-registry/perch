[package]
name = "perch-smart-account"
description = "The doc-only smart-account trait: applying documents (apply_doc, apply_scope) is the sole write path, on OZ evaluation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
soroban-sdk-tools = { workspace = true }
# OZ's `do_check_auth`, which decides a recovery completion over the two
# registry entries the account keeps for its recovery rule.
stellar-accounts = { workspace = true }
# The signer, the `__check_auth` payload, the context rule, and the error
# codes: the XDR and contract-spec twins of OZ's.
perch-account-types = { version = "0.1.0", path = "../perch-account-types" }
# Client + wire types only — `contract` off, so no compiler code (parser,
# lowering) is ever linked into account wasm.
perch-doc-compiler = { version = "0.3.5", path = "../perch-doc-compiler", default-features = false }
# The recovery controller's hook client, the pool's insertion client, the
# account constants (upgrade delay, invoker-only names), and the compiled
# recovery types. A plain library: no controller code is linked into account
# wasm, and neither deployable pins the other.
perch-recovery-interface = { version = "0.1.0", path = "../perch-recovery-interface" }
# The rule-eval rule set the account stores: rule-core's lowering (rule-eval)
# of the compiled document's model, held in `perch-rule-eval`'s storage
# mirrors, its addresses read through soroban-facade.
rule-eval = { workspace = true }
perch-rule-eval = { version = "0.1.0", path = "../perch-rule-eval" }
# The pure `registry_id + wasm_hash → address` derivation `apply_doc` uses to
# resolve the compiler + interpreter from the pinned constructorless-registry id.
perch-registry-resolve = { version = "0.1.1", path = "../perch-registry-resolve" }

[features]
# Test-only: the full-replace `apply_doc` oracle (`testutils` module). Never
# enabled by a deployable.
testutils = []

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
