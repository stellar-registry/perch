[package]
name = "perch-spending-limit"
description = "Deployable OZ spending_limit policy: the cumulative spend cap perch attaches beside the interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# No cargo-manifest `publish = false` here: release-plz's `release` command
# SKIPS manifest-unpublishable packages entirely (no tag, absent from its
# `releases` output), which would kill the release.yml spending-limit chain.
# crates.io publishes are already impossible workspace-wide (release-plz.toml
# `[workspace] publish = false`, and the stellar-accounts git pin would be
# rejected anyway).

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
