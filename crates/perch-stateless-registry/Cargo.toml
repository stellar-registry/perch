[package]
name = "perch-stateless-registry"
description = "Managed 'stateless' subregistry: publish-here-iff-stateless; content-addressed deploy (salt = wasm_hash). Composed from the imported registry contracttraits."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# `alloc` enables soroban's bump allocator on wasm — the registry contracttraits
# parse names / upload wasm bytes on-chain.
soroban-sdk = { workspace = true, features = ["alloc"] }

# The importable registry contracttraits (stellar-registry/contracts PR #33,
# crate `registry-traits`). Version-flexible on soroban-sdk (`>=25.3.1, <28`):
# this workspace pins 27.0.2, so it unifies to a single soroban-sdk 27.x — no
# two-major split. `default-features` (`alloc`) are what the trait bodies need
# (name parsing / wasm upload on-chain). Optional + gated behind `contract` so
# `--no-default-features` yields an empty library with no git dependency.
#
# NOTE (registry-traits gap worked around locally, see src/lib.rs): this crate
# exposes NO `Administratable`/`Upgradable` contracttrait — the canonical
# `registry` contract gets those from `admin-sep`, which caps at soroban-sdk ^25
# and so cannot be used from this sdk-27 workspace. `registry-traits`
# deliberately ships only the `registry_traits::admin` free-function key
# convention instead. The admin/upgrade entry points are therefore provided as
# thin local glue in src/lib.rs. Manager/root wiring IS a public seam
# (`storage::Storage::set_manager_no_auth` / `set_root_registry`).
registry-traits = { git = "https://github.com/stellar-registry/contracts", branch = "feat/registry-importable-stateless-deploy", package = "registry-traits", optional = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
# Mirrors the perch-doc-compiler template: the deployable contract lives behind
# `contract`, on by default. `contract` pulls in `registry-traits` and gates the
# composition module. Build the empty skeleton (no git dep) with
# `--no-default-features`.
default = ["contract"]
contract = ["dep:registry-traits"]
