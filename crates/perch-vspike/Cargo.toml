[package]
name = "perch-vspike"
description = "SPIKE ONLY (never published): versioned rule storage behind OZ's authenticate"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
perch-program = { workspace = true }
stellar-accounts = { workspace = true }
perch-doc-compiler = { version = "0.3.0", path = "../perch-doc-compiler", default-features = false }
