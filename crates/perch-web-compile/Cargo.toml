[package]
name = "perch-web-compile"
description = "Compile perch-web/v1 policies into matched browser and server plans"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
perch-web-ir = { path = "../perch-web-ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
