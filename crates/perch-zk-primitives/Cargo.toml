[package]
name = "perch-zk-primitives"
description = "Host-side hashing for Perch ZK recovery: the Poseidon2 commitment, leaf, nullifier, statement-hash, and Merkle-node formulas the circuit proves"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
soroban-poseidon = { workspace = true }
# Domain constants, the field split, and the statement projection: the spec's
# single definition, which this crate only adds hashing to.
perch-recovery-interface = { version = "0.1.0", path = "../perch-recovery-interface" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
