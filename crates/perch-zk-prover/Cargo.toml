[package]
name = "perch-zk-prover"
description = "Native proof helpers for Perch ZK recovery: Merkle witnesses, circuit inputs, and a nargo/bb driver for fixtures and tooling"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[[bin]]
name = "perch-zk-fixtures"
path = "src/bin/fixtures.rs"

[dependencies]
# testutils: an in-process `Env` is how this crate runs the host's Poseidon2
# permutation natively, so witnesses are computed by the exact code the
# contracts run on-chain rather than a second Poseidon2 implementation.
soroban-sdk = { workspace = true, features = ["testutils"] }
perch-recovery-interface = { version = "0.1.0", path = "../perch-recovery-interface" }
perch-zk-primitives = { version = "0.1.0", path = "../perch-zk-primitives" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
