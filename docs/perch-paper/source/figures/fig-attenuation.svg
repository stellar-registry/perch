<svg class="wide" viewBox="0 0 760 572" role="img" aria-labelledby="fig-attenuation-title" aria-describedby="fig-attenuation-text"><text x="2" y="16" class="m tag" font-size="14">MODEL</text><text x="60" y="16" class="m" font-size="14">computed from the attenuation steps; not run on chain</text><rect x="2" y="30" width="246" height="210" rx="6" class="bx"/><text x="14" y="52" class="t tag" font-size="14">PARENT GRANT</text><text x="14" y="74" class="t" font-size="15">rule play</text><text x="28" y="92" class="x" font-size="15">the game, any function</text><text x="28" y="110" class="x" font-size="15"><tspan class="mono">app</tspan> or <tspan class="mono">helper</tspan>, threshold 1</text><text x="28" y="128" class="x" font-size="15">last ledger 5000</text><text x="14" y="150" class="t" font-size="15">rule shop</text><text x="28" y="168" class="x" font-size="15">XLM, <tspan class="mono">transfer</tspan></text><text x="28" y="186" class="x" font-size="15">recipient is the shop</text><text x="28" y="204" class="x" font-size="15"><tspan class="mono">app</tspan> or <tspan class="mono">helper</tspan>, threshold 1</text><text x="28" y="222" class="x" font-size="15">cap 10 per 100 ledgers</text><rect x="512" y="30" width="246" height="210" rx="6" class="bx"/><text x="524" y="52" class="t tag" font-size="14">CHILD GRANT</text><text x="524" y="74" class="t" font-size="15">rule play</text><rect x="526" y="79" width="5" height="16" rx="0" class="bx bx-k"/><text x="538" y="92" class="x" font-size="15">the game, <tspan class="mono">guess</tspan></text><text x="538" y="110" class="x" font-size="15"><tspan class="mono">app</tspan> or <tspan class="mono">helper</tspan>, threshold 1</text><text x="538" y="128" class="x" font-size="15">last ledger 5000</text><text x="524" y="150" class="t" font-size="15">rule shop</text><text x="538" y="168" class="x" font-size="15">XLM, <tspan class="mono">transfer</tspan></text><text x="538" y="186" class="x" font-size="15">recipient is the shop</text><rect x="526" y="191" width="5" height="16" rx="0" class="bx bx-k"/><text x="538" y="204" class="x" font-size="15"><tspan class="mono">app</tspan>, threshold 1</text><rect x="526" y="209" width="5" height="16" rx="0" class="bx bx-k"/><text x="538" y="222" class="x" font-size="15">cap 4 per 100 ledgers</text><text x="261" y="52" class="t tag" font-size="14">STEPS</text><g data-step-result="applied"><circle cx="272" cy="69" r="11" class="bx"/><text x="272" y="73.9" class="t" font-size="14" text-anchor="middle">1</text><text x="291" y="74" class="x" font-size="15">restrict <tspan class="mono">play</tspan> to <tspan class="mono">guess</tspan></text></g><g data-step-result="applied"><circle cx="272" cy="95" r="11" class="bx"/><text x="272" y="99.9" class="t" font-size="14" text-anchor="middle">2</text><text x="291" y="100" class="x" font-size="15">lower the cap limit to 4</text></g><g data-step-result="applied"><circle cx="272" cy="121" r="11" class="bx"/><text x="272" y="125.9" class="t" font-size="14" text-anchor="middle">3</text><text x="291" y="126" class="x" font-size="15">remove the signer <tspan class="mono">helper</tspan></text><text x="291" y="144" class="x" font-size="15">from <tspan class="mono">shop</tspan></text></g><g data-step-result="refused"><path d="M267 160l10 10M277 160l-10 10" class="gl-d"/><text x="291" y="170" class="d" font-size="15">raise the cap limit to 20:</text><text x="291" y="188" class="d" font-size="15">refused (a higher limit);</text><text x="291" y="206" class="d" font-size="15">nothing changes</text></g><text x="2" y="264" class="m" font-size="14">A bar at the left of a line marks a part of the child the steps narrowed.</text><text x="2" y="294" class="t tag" font-size="14">PROBE</text><text x="470" y="294" class="t tag" font-size="14">PARENT</text><text x="620" y="294" class="t tag" font-size="14">CHILD</text><g data-probe="guess" data-parent="accepts" data-child="accepts"><line x1="2" y1="302" x2="758" y2="302" class="rule"/><text x="2" y="324" class="x" font-size="15">the game’s <tspan class="mono">guess</tspan></text><path d="M470 319l4 5l8-10" class="gl"/><text x="492" y="324" class="x" font-size="15">accepts</text><path d="M620 319l4 5l8-10" class="gl"/><text x="642" y="324" class="x" font-size="15">accepts</text></g><g data-probe="t1" data-parent="accepts" data-child="accepts"><line x1="2" y1="330" x2="758" y2="330" class="rule"/><text x="2" y="352" class="x" font-size="15">transfer 1 to the shop</text><path d="M470 347l4 5l8-10" class="gl"/><text x="492" y="352" class="x" font-size="15">accepts</text><path d="M620 347l4 5l8-10" class="gl"/><text x="642" y="352" class="x" font-size="15">accepts</text></g><g data-probe="t5" data-parent="accepts" data-child="refuses"><line x1="2" y1="358" x2="758" y2="358" class="rule"/><text x="2" y="380" class="x" font-size="15">transfer 5 to the shop</text><path d="M470 375l4 5l8-10" class="gl"/><text x="492" y="380" class="x" font-size="15">accepts</text><path d="M621 370l10 10M631 370l-10 10" class="gl-d"/><path d="M635 368V382" class="fl-d"/><text x="642" y="380" class="d" font-size="15">refuses</text></g><g data-probe="else" data-parent="refuses" data-child="refuses"><line x1="2" y1="386" x2="758" y2="386" class="rule"/><text x="2" y="408" class="x" font-size="15">transfer 1 elsewhere</text><path d="M471 398l10 10M481 398l-10 10" class="gl-d"/><path d="M485 396V410" class="fl-d"/><text x="492" y="408" class="d" font-size="15">refuses</text><path d="M621 398l10 10M631 398l-10 10" class="gl-d"/><path d="M635 396V410" class="fl-d"/><text x="642" y="408" class="d" font-size="15">refuses</text></g><g data-probe="approve" data-parent="refuses" data-child="refuses"><line x1="2" y1="414" x2="758" y2="414" class="rule"/><text x="2" y="436" class="x" font-size="15"><tspan class="mono">approve</tspan> on XLM</text><path d="M471 426l10 10M481 426l-10 10" class="gl-d"/><path d="M485 424V438" class="fl-d"/><text x="492" y="436" class="d" font-size="15">refuses</text><path d="M621 426l10 10M631 426l-10 10" class="gl-d"/><path d="M635 424V438" class="fl-d"/><text x="642" y="436" class="d" font-size="15">refuses</text></g><g data-probe="account" data-parent="refuses" data-child="refuses"><line x1="2" y1="442" x2="758" y2="442" class="rule"/><text x="2" y="464" class="x" font-size="15">a call to the account</text><path d="M471 454l10 10M481 454l-10 10" class="gl-d"/><path d="M485 452V466" class="fl-d"/><text x="492" y="464" class="d" font-size="15">refuses</text><path d="M621 454l10 10M631 454l-10 10" class="gl-d"/><path d="M635 452V466" class="fl-d"/><text x="642" y="464" class="d" font-size="15">refuses</text></g><g data-probe="helper" data-parent="accepts" data-child="refuses"><line x1="2" y1="470" x2="758" y2="470" class="rule"/><text x="2" y="492" class="x" font-size="15">a transfer signed by <tspan class="mono">helper</tspan> alone</text><path d="M470 487l4 5l8-10" class="gl"/><text x="492" y="492" class="x" font-size="15">accepts</text><path d="M621 482l10 10M631 482l-10 10" class="gl-d"/><path d="M635 480V494" class="fl-d"/><text x="642" y="492" class="d" font-size="15">refuses</text></g><line x1="2" y1="498" x2="758" y2="498" class="rule"/><text x="2" y="522" class="t" font-size="15">The child accepts 2 of 7 probes, and the parent accepts each of them; the parent accepts 4.</text><text x="2" y="546" class="x" font-size="15">Replay: the child accepts 5 of 6 requests (a guess, then five transfers of 1, one ledger apart; the fifth would</text><text x="2" y="564" class="x" font-size="15">make 5 &gt; 4). From empty records the parent accepts all 5.</text></svg>
