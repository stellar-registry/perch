<svg class="narrow" viewBox="0 0 340 1444" role="img" aria-labelledby="fig-auth-path-title" aria-describedby="fig-auth-path-text" data-recorded-trap="Error(Crypto, InvalidInput)" data-recorded-command="11"><text x="2" y="16" class="t tag" font-size="14">THE ACCOUNT’S STAGES AND EXITS</text><text x="2" y="36" class="m" font-size="14">MODEL. Rules: <tspan class="mono">shop</tspan> (XLM to the shop, 10 per</text><text x="2" y="53" class="m" font-size="14">100 ledgers; its window holds 6), and the game</text><text x="2" y="70" class="m" font-size="14">grant’s <tspan class="mono">guess</tspan> and <tspan class="mono">spend</tspan> (XLM, 2 per 100). Signed</text><text x="2" y="87" class="m" font-size="14">by the app’s key unless noted.</text><g data-stage="host"><rect x="2" y="101" width="336" height="92" rx="6" class="bx"/><rect x="5" y="104" width="11" height="86" rx="0" class="tr"/><text x="28" y="125" class="t" font-size="14">1  Host call</text><text x="28" y="145" class="x" font-size="14">The host calls <tspan class="mono">__check_auth</tspan>: the</text><text x="28" y="163" class="x" font-size="14">contexts, one named rule per context, the</text><text x="28" y="181" class="x" font-size="14">claimed signers.</text><g data-mark="pass" data-print="no" class="off"><path d="M312 119l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M313 114l10 10M323 114l-10 10" class="gl-d"/><path d="M327 112V126" class="fl-d"/></g></g><path d="M42 195V213" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-stage="guards"><rect x="2" y="217" width="336" height="147" rx="6" class="bx"/><text x="14" y="241" class="t" font-size="14">2  Guards</text><text x="14" y="261" class="x" font-size="14">Reserved hook names, an account frozen</text><text x="14" y="279" class="x" font-size="14">during a recovery, a grant rule on the</text><text x="14" y="297" class="x" font-size="14">account’s adopted recovery contracts.</text><text x="14" y="318" class="m" font-size="14">exits: <tspan class="mono">ReservedFunction</tspan> (1);</text><text x="14" y="335" class="m" font-size="14"><tspan class="mono">AccountFrozen</tspan> (2); <tspan class="mono">ScopeEscalation</tspan> (4); a</text><text x="14" y="352" class="m" font-size="14">completion: decided by the recovery controller</text><g data-mark="pass" data-print="no" class="off"><path d="M312 235l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M313 230l10 10M323 230l-10 10" class="gl-d"/><path d="M327 228V242" class="fl-d"/></g></g><path d="M42 366V384" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-stage="select"><rect x="2" y="388" width="336" height="95" rx="6" class="bx"/><text x="14" y="412" class="t" font-size="14">3  Select rules</text><text x="14" y="432" class="x" font-size="14">Look up each named rule and its spending</text><text x="14" y="450" class="x" font-size="14">record; no search.</text><text x="14" y="471" class="m" font-size="14">exits: <tspan class="mono">ContextRuleNotFound</tspan> (3000)</text><g data-mark="pass" data-print="no" class="off"><path d="M312 406l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M313 401l10 10M323 401l-10 10" class="gl-d"/><path d="M327 399V413" class="fl-d"/></g></g><path d="M42 485V503" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-stage="decide"><rect x="2" y="507" width="336" height="274" rx="6" class="bx bx-pr"/><rect x="6" y="511" width="328" height="266" rx="2" class="fl-g"/><text x="14" y="531" class="t" font-size="14">4  Decide</text><text x="14" y="551" class="x" font-size="14"><tspan class="mono">rule_eval::authorize</tspan>: no storage read,</text><text x="14" y="569" class="x" font-size="14">no signature checked.</text><text x="14" y="590" class="m" font-size="14">exits: stale grant: <tspan class="mono">StaleScope</tspan> (3); otherwise</text><text x="14" y="607" class="m" font-size="14"><tspan class="mono">RuleEvalRefused</tspan> (5)</text><g data-check="found"><rect x="14" y="617" width="153" height="26" rx="4" class="bx"/><text x="22" y="635" class="x" font-size="14">rule found</text><g data-mark="pass" data-print="no" class="off"><path d="M143 630l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M144 625l10 10M154 625l-10 10" class="gl-d"/><path d="M158 623V637" class="fl-d"/></g></g><g data-check="unexpired"><rect x="173" y="617" width="153" height="26" rx="4" class="bx"/><text x="181" y="635" class="x" font-size="14">unexpired</text><g data-mark="pass" data-print="no" class="off"><path d="M302 630l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M303 625l10 10M313 625l-10 10" class="gl-d"/><path d="M317 623V637" class="fl-d"/></g></g><g data-check="generation"><rect x="14" y="647" width="153" height="26" rx="4" class="bx"/><text x="22" y="665" class="x" font-size="14">current generation</text><g data-mark="pass" data-print="no" class="off"><path d="M143 660l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M144 655l10 10M154 655l-10 10" class="gl-d"/><path d="M158 653V667" class="fl-d"/></g></g><g data-check="target"><rect x="173" y="647" width="153" height="26" rx="4" class="bx"/><text x="181" y="665" class="x" font-size="14">target</text><g data-mark="pass" data-print="no" class="off"><path d="M302 660l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M303 655l10 10M313 655l-10 10" class="gl-d"/><path d="M317 653V667" class="fl-d"/></g></g><g data-check="function"><rect x="14" y="677" width="153" height="26" rx="4" class="bx"/><text x="22" y="695" class="x" font-size="14">function</text><g data-mark="pass" data-print="no" class="off"><path d="M143 690l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M144 685l10 10M154 685l-10 10" class="gl-d"/><path d="M158 683V697" class="fl-d"/></g></g><g data-check="arguments"><rect x="173" y="677" width="153" height="26" rx="4" class="bx"/><text x="181" y="695" class="x" font-size="14">arguments</text><g data-mark="pass" data-print="no" class="off"><path d="M302 690l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M303 685l10 10M313 685l-10 10" class="gl-d"/><path d="M317 683V697" class="fl-d"/></g></g><g data-check="threshold"><rect x="14" y="707" width="153" height="26" rx="4" class="bx"/><text x="22" y="725" class="x" font-size="14">threshold</text><g data-mark="pass" data-print="no" class="off"><path d="M143 720l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M144 715l10 10M154 715l-10 10" class="gl-d"/><path d="M158 713V727" class="fl-d"/></g></g><g data-check="signers"><rect x="173" y="707" width="153" height="26" rx="4" class="bx"/><text x="181" y="725" class="x" font-size="14">every signer used</text><g data-mark="pass" data-print="no" class="off"><path d="M302 720l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M303 715l10 10M313 715l-10 10" class="gl-d"/><path d="M317 713V727" class="fl-d"/></g></g><g data-check="charge"><rect x="14" y="737" width="153" height="26" rx="4" class="bx"/><text x="22" y="755" class="x" font-size="14">charge</text><g data-mark="pass" data-print="no" class="off"><path d="M143 750l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M144 745l10 10M154 745l-10 10" class="gl-d"/><path d="M158 743V757" class="fl-d"/></g></g><g data-mark="pass" data-print="no" class="off"><path d="M312 525l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M313 520l10 10M323 520l-10 10" class="gl-d"/><path d="M327 518V532" class="fl-d"/></g></g><g data-exits="decide"><g data-exit="over app current right"><path d="M7 797l8 8M15 797l-8 8" class="gl-d"/><path d="M19 794V807" class="fl-d"/><text x="28" y="806" class="x" font-size="14">pay the shop 5, over the cap: charge: 6 + 5 =</text><text x="28" y="823" class="x" font-size="14">11 &gt; 10</text></g><g data-exit="account app current right"><path d="M7 837l8 8M15 837l-8 8" class="gl-d"/><path d="M19 834V847" class="fl-d"/><text x="28" y="846" class="x" font-size="14">a call to the account: target</text></g><g data-exit="within unlisted current right"><path d="M7 860l8 8M15 860l-8 8" class="gl-d"/><path d="M19 857V870" class="fl-d"/><text x="28" y="869" class="x" font-size="14">a key on no rule: threshold: 0 of 1 listed</text><text x="28" y="886" class="x" font-size="14">signers</text></g><g data-exit="within app expired right"><path d="M7 900l8 8M15 900l-8 8" class="gl-d"/><path d="M19 897V910" class="fl-d"/><text x="28" y="909" class="x" font-size="14">an expired grant: unexpired</text></g><g data-exit="within app stale right"><path d="M7 923l8 8M15 923l-8 8" class="gl-d"/><path d="M19 920V933" class="fl-d"/><text x="28" y="932" class="x" font-size="14">a grant from before a recovery: current</text><text x="28" y="949" class="x" font-size="14">generation</text></g><g data-exit="within app current wrong"><path d="M7 963l8 8M15 963l-8 8" class="gl-d"/><path d="M19 960V973" class="fl-d"/><text x="28" y="972" class="x" font-size="14">the wrong rule named: charge: 0 + 4 = 4 &gt; 2</text></g><text x="28" y="995" class="m" font-size="14">Every refusal here: nothing written, no verifier</text><text x="28" y="1012" class="m" font-size="14">called.</text></g><path d="M42 1020V1038" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-stage="authenticate"><rect x="2" y="1042" width="336" height="147" rx="6" class="bx"/><rect x="5" y="1045" width="11" height="141" rx="0" class="tr"/><text x="28" y="1066" class="t" font-size="14">5  Authenticate</text><text x="28" y="1086" class="x" font-size="14">A digest of the payload, the account and</text><text x="28" y="1104" class="x" font-size="14">the rule IDs; each signer’s verifier checks</text><text x="28" y="1122" class="x" font-size="14">it.</text><text x="28" y="1143" class="m" font-size="14">exits: bad signature: the verifier traps</text><text x="28" y="1160" class="m" font-size="14">(Error(Crypto, InvalidInput) for Ed25519);</text><text x="28" y="1177" class="m" font-size="14"><tspan class="mono">ExternalVerificationFailed</tspan> (3003)</text><g data-mark="pass" data-print="no" class="off"><path d="M312 1060l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M313 1055l10 10M323 1055l-10 10" class="gl-d"/><path d="M327 1053V1067" class="fl-d"/></g></g><g data-exits="authenticate"><g data-exit="within forged current right"><path d="M7 1205l8 8M15 1205l-8 8" class="gl-d"/><path d="M19 1202V1215" class="fl-d"/><text x="28" y="1214" class="x" font-size="14">another key signing as the app: the decision</text><text x="28" y="1231" class="x" font-size="14">accepts; the verifier traps (recorded run,</text><text x="28" y="1248" class="x" font-size="14">command 11: Error(Crypto, InvalidInput))</text></g></g><path d="M42 1256V1274" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-stage="store"><rect x="2" y="1278" width="336" height="74" rx="6" class="bx"/><text x="14" y="1302" class="t" font-size="14">6  Store</text><text x="14" y="1322" class="x" font-size="14">Write each changed spending record.</text><text x="14" y="1340" class="x" font-size="14">Authorized.</text><g data-mark="pass" data-print="no" class="off"><path d="M312 1296l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M313 1291l10 10M323 1291l-10 10" class="gl-d"/><path d="M327 1289V1303" class="fl-d"/></g></g><g data-exits="store"><g data-exit="within app current right"><path d="M6 1372l4 5l8-10" class="gl"/><text x="28" y="1377" class="x" font-size="14">pay the shop 4, within the cap: accepted;</text><text x="28" y="1394" class="x" font-size="14"><tspan class="mono">shop</tspan> window 6 + 4 = 10 of 10</text></g><g data-exit="guess app current right"><path d="M6 1412l4 5l8-10" class="gl"/><text x="28" y="1417" class="x" font-size="14">a lost guess: accepted; <tspan class="mono">spend</tspan> window 0 + 1 =</text><text x="28" y="1434" class="x" font-size="14">1 of 2</text></g></g></svg>
