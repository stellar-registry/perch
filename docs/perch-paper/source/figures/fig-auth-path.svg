<svg class="wide" viewBox="0 0 760 992" role="img" aria-labelledby="fig-auth-path-title" aria-describedby="fig-auth-path-text" data-recorded-trap="Error(Crypto, InvalidInput)" data-recorded-command="11"><text x="2" y="16" class="t tag" font-size="14">THE ACCOUNT’S STAGES AND EXITS</text><text x="368" y="16" class="t tag" font-size="14">WHERE EACH SCENARIO STOPS</text><text x="368" y="36" class="m" font-size="14">MODEL. Rules: <tspan class="mono">shop</tspan> (XLM to the shop, 10 per 100</text><text x="368" y="53" class="m" font-size="14">ledgers; its window holds 6), and the game grant’s <tspan class="mono">guess</tspan></text><text x="368" y="70" class="m" font-size="14">and <tspan class="mono">spend</tspan> (XLM, 2 per 100). Signed by the app’s key</text><text x="368" y="87" class="m" font-size="14">unless noted.</text><g data-exits="host"></g><g data-stage="host"><rect x="2" y="30" width="352" height="96" rx="6" class="bx"/><rect x="5" y="33" width="11" height="90" rx="0" class="tr"/><text x="28" y="54" class="t" font-size="15">1  Host call</text><text x="28" y="74" class="x" font-size="15">The host calls <tspan class="mono">__check_auth</tspan>: the</text><text x="28" y="92" class="x" font-size="15">contexts, one named rule per context,</text><text x="28" y="110" class="x" font-size="15">the claimed signers.</text><g data-mark="pass" data-print="no" class="off"><path d="M328 48l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M329 43l10 10M339 43l-10 10" class="gl-d"/><path d="M343 41V55" class="fl-d"/></g></g><path d="M42 128V146" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-exits="guards"></g><g data-stage="guards"><rect x="2" y="150" width="352" height="147" rx="6" class="bx"/><text x="14" y="174" class="t" font-size="15">2  Guards</text><text x="14" y="194" class="x" font-size="15">Reserved hook names, an account frozen</text><text x="14" y="212" class="x" font-size="15">during a recovery, a grant rule on the</text><text x="14" y="230" class="x" font-size="15">account’s adopted recovery contracts.</text><text x="14" y="251" class="m" font-size="14">exits: <tspan class="mono">ReservedFunction</tspan> (1); <tspan class="mono">AccountFrozen</tspan></text><text x="14" y="268" class="m" font-size="14">(2); <tspan class="mono">ScopeEscalation</tspan> (4); a completion: decided</text><text x="14" y="285" class="m" font-size="14">by the recovery controller</text><g data-mark="pass" data-print="no" class="off"><path d="M328 168l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M329 163l10 10M339 163l-10 10" class="gl-d"/><path d="M343 161V175" class="fl-d"/></g></g><path d="M42 299V317" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-exits="select"></g><g data-stage="select"><rect x="2" y="321" width="352" height="95" rx="6" class="bx"/><text x="14" y="345" class="t" font-size="15">3  Select rules</text><text x="14" y="365" class="x" font-size="15">Look up each named rule and its spending</text><text x="14" y="383" class="x" font-size="15">record; no search.</text><text x="14" y="404" class="m" font-size="14">exits: <tspan class="mono">ContextRuleNotFound</tspan> (3000)</text><g data-mark="pass" data-print="no" class="off"><path d="M328 339l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M329 334l10 10M339 334l-10 10" class="gl-d"/><path d="M343 332V346" class="fl-d"/></g></g><path d="M42 418V436" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-exits="decide"><g data-exit="over app current right"><path d="M369 451l8 8M377 451l-8 8" class="gl-d"/><path d="M381 448V461" class="fl-d"/><text x="388" y="460" class="x" font-size="14">pay the shop 5, over the cap: charge: 6 + 5 = 11 &gt; 10</text></g><g data-exit="account app current right"><path d="M369 474l8 8M377 474l-8 8" class="gl-d"/><path d="M381 471V484" class="fl-d"/><text x="388" y="483" class="x" font-size="14">a call to the account: target</text></g><g data-exit="within unlisted current right"><path d="M369 497l8 8M377 497l-8 8" class="gl-d"/><path d="M381 494V507" class="fl-d"/><text x="388" y="506" class="x" font-size="14">a key on no rule: threshold: 0 of 1 listed signers</text></g><g data-exit="within app expired right"><path d="M369 520l8 8M377 520l-8 8" class="gl-d"/><path d="M381 517V530" class="fl-d"/><text x="388" y="529" class="x" font-size="14">an expired grant: unexpired</text></g><g data-exit="within app stale right"><path d="M369 543l8 8M377 543l-8 8" class="gl-d"/><path d="M381 540V553" class="fl-d"/><text x="388" y="552" class="x" font-size="14">a grant from before a recovery: current generation</text></g><g data-exit="within app current wrong"><path d="M369 566l8 8M377 566l-8 8" class="gl-d"/><path d="M381 563V576" class="fl-d"/><text x="388" y="575" class="x" font-size="14">the wrong rule named: charge: 0 + 4 = 4 &gt; 2</text></g><text x="388" y="602" class="m" font-size="14">Every refusal here: nothing written,</text><text x="388" y="619" class="m" font-size="14">no verifier called.</text></g><g data-stage="decide"><rect x="2" y="440" width="352" height="274" rx="6" class="bx bx-pr"/><rect x="6" y="444" width="344" height="266" rx="2" class="fl-g"/><text x="14" y="464" class="t" font-size="15">4  Decide</text><text x="14" y="484" class="x" font-size="15"><tspan class="mono">rule_eval::authorize</tspan>: no storage</text><text x="14" y="502" class="x" font-size="15">read, no signature checked.</text><text x="14" y="523" class="m" font-size="14">exits: stale grant: <tspan class="mono">StaleScope</tspan> (3); otherwise</text><text x="14" y="540" class="m" font-size="14"><tspan class="mono">RuleEvalRefused</tspan> (5)</text><g data-check="found"><rect x="14" y="550" width="161" height="26" rx="4" class="bx"/><text x="22" y="568" class="x" font-size="14">rule found</text><g data-mark="pass" data-print="no" class="off"><path d="M151 563l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M152 558l10 10M162 558l-10 10" class="gl-d"/><path d="M166 556V570" class="fl-d"/></g></g><g data-check="unexpired"><rect x="181" y="550" width="161" height="26" rx="4" class="bx"/><text x="189" y="568" class="x" font-size="14">unexpired</text><g data-mark="pass" data-print="no" class="off"><path d="M318 563l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M319 558l10 10M329 558l-10 10" class="gl-d"/><path d="M333 556V570" class="fl-d"/></g></g><g data-check="generation"><rect x="14" y="580" width="161" height="26" rx="4" class="bx"/><text x="22" y="598" class="x" font-size="14">current generation</text><g data-mark="pass" data-print="no" class="off"><path d="M151 593l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M152 588l10 10M162 588l-10 10" class="gl-d"/><path d="M166 586V600" class="fl-d"/></g></g><g data-check="target"><rect x="181" y="580" width="161" height="26" rx="4" class="bx"/><text x="189" y="598" class="x" font-size="14">target</text><g data-mark="pass" data-print="no" class="off"><path d="M318 593l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M319 588l10 10M329 588l-10 10" class="gl-d"/><path d="M333 586V600" class="fl-d"/></g></g><g data-check="function"><rect x="14" y="610" width="161" height="26" rx="4" class="bx"/><text x="22" y="628" class="x" font-size="14">function</text><g data-mark="pass" data-print="no" class="off"><path d="M151 623l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M152 618l10 10M162 618l-10 10" class="gl-d"/><path d="M166 616V630" class="fl-d"/></g></g><g data-check="arguments"><rect x="181" y="610" width="161" height="26" rx="4" class="bx"/><text x="189" y="628" class="x" font-size="14">arguments</text><g data-mark="pass" data-print="no" class="off"><path d="M318 623l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M319 618l10 10M329 618l-10 10" class="gl-d"/><path d="M333 616V630" class="fl-d"/></g></g><g data-check="threshold"><rect x="14" y="640" width="161" height="26" rx="4" class="bx"/><text x="22" y="658" class="x" font-size="14">threshold</text><g data-mark="pass" data-print="no" class="off"><path d="M151 653l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M152 648l10 10M162 648l-10 10" class="gl-d"/><path d="M166 646V660" class="fl-d"/></g></g><g data-check="signers"><rect x="181" y="640" width="161" height="26" rx="4" class="bx"/><text x="189" y="658" class="x" font-size="14">every signer used</text><g data-mark="pass" data-print="no" class="off"><path d="M318 653l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M319 648l10 10M329 648l-10 10" class="gl-d"/><path d="M333 646V660" class="fl-d"/></g></g><g data-check="charge"><rect x="14" y="670" width="161" height="26" rx="4" class="bx"/><text x="22" y="688" class="x" font-size="14">charge</text><g data-mark="pass" data-print="no" class="off"><path d="M151 683l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M152 678l10 10M162 678l-10 10" class="gl-d"/><path d="M166 676V690" class="fl-d"/></g></g><g data-mark="pass" data-print="no" class="off"><path d="M328 458l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M329 453l10 10M339 453l-10 10" class="gl-d"/><path d="M343 451V465" class="fl-d"/></g></g><path d="M42 716V734" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-exits="authenticate"><g data-exit="within forged current right"><path d="M369 749l8 8M377 749l-8 8" class="gl-d"/><path d="M381 746V759" class="fl-d"/><text x="388" y="758" class="x" font-size="14">another key signing as the app: the decision accepts;</text><text x="388" y="775" class="x" font-size="14">the verifier traps (recorded run, command 11:</text><text x="388" y="792" class="x" font-size="14">Error(Crypto, InvalidInput))</text></g></g><g data-stage="authenticate"><rect x="2" y="738" width="352" height="147" rx="6" class="bx"/><rect x="5" y="741" width="11" height="141" rx="0" class="tr"/><text x="28" y="762" class="t" font-size="15">5  Authenticate</text><text x="28" y="782" class="x" font-size="15">A digest of the payload, the account and</text><text x="28" y="800" class="x" font-size="15">the rule IDs; each signer’s verifier checks</text><text x="28" y="818" class="x" font-size="15">it.</text><text x="28" y="839" class="m" font-size="14">exits: bad signature: the verifier traps</text><text x="28" y="856" class="m" font-size="14">(Error(Crypto, InvalidInput) for Ed25519);</text><text x="28" y="873" class="m" font-size="14"><tspan class="mono">ExternalVerificationFailed</tspan> (3003)</text><g data-mark="pass" data-print="no" class="off"><path d="M328 756l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M329 751l10 10M339 751l-10 10" class="gl-d"/><path d="M343 749V763" class="fl-d"/></g></g><path d="M42 887V905" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-exits="store"><g data-exit="within app current right"><path d="M368 924l4 5l8-10" class="gl"/><text x="388" y="929" class="x" font-size="14">pay the shop 4, within the cap: accepted; <tspan class="mono">shop</tspan> window</text><text x="388" y="946" class="x" font-size="14">6 + 4 = 10 of 10</text></g><g data-exit="guess app current right"><path d="M368 964l4 5l8-10" class="gl"/><text x="388" y="969" class="x" font-size="14">a lost guess: accepted; <tspan class="mono">spend</tspan> window 0 + 1 = 1 of 2</text></g></g><g data-stage="store"><rect x="2" y="909" width="352" height="79" rx="6" class="bx"/><text x="14" y="933" class="t" font-size="15">6  Store</text><text x="14" y="953" class="x" font-size="15">Write each changed spending record.</text><text x="14" y="971" class="x" font-size="15">Authorized.</text><g data-mark="pass" data-print="no" class="off"><path d="M328 927l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M329 922l10 10M339 922l-10 10" class="gl-d"/><path d="M343 920V934" class="fl-d"/></g></g></svg>
