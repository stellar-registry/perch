<svg class="narrow" viewBox="0 0 340 1649" role="img" aria-labelledby="fig-check-auth-title" aria-describedby="fig-check-auth-text"><rect x="2" y="2" width="336" height="119" rx="6" class="bx bx-k"/><text x="14" y="29" class="x" font-size="14">Soroban host →</text><text x="14" y="48" class="x" font-size="14"><tspan class="mono">__check_auth(signature_payload, auth</tspan></text><text x="14" y="67" class="x" font-size="14"><tspan class="mono">payload, contexts)</tspan>. The auth payload</text><text x="14" y="86" class="x" font-size="14">carries <tspan class="mono">context_rule_ids</tspan> and the claimed</text><text x="14" y="105" class="x" font-size="14">signers.</text><text x="2" y="149" class="m tag" font-size="14">ACCOUNT SHELL · TESTED</text><g><rect x="32" y="165" width="306" height="81" rx="6" class="bx"/><text x="44" y="192" class="x" font-size="14">A context calls a reserved hook on any</text><text x="44" y="211" class="x" font-size="14">contract: <tspan class="mono">install</tspan>, <tspan class="mono">uninstall</tspan>, <tspan class="mono">enforce</tspan></text><text x="44" y="230" class="x" font-size="14">or an <tspan class="mono">rcv_*</tspan> name?</text><circle cx="14" cy="185" r="11" class="bx"/><text x="14" y="189.9" class="t" font-size="14" text-anchor="middle">1</text><path d="M44 246V267H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="254" width="161.71" height="26" rx="13" class="pill pill-d"/><text x="73" y="272.04" class="d" font-size="14">ReservedFunction · 1</text></g><g><rect x="32" y="290" width="306" height="100" rx="6" class="bx"/><text x="44" y="317" class="x" font-size="14">Recovery completion? Exactly one</text><text x="44" y="336" class="x" font-size="14"><tspan class="mono">apply_doc</tspan> context on this account,</text><text x="44" y="355" class="x" font-size="14">selecting the recovery rule. Classification</text><text x="44" y="374" class="x" font-size="14">only.</text><circle cx="14" cy="310" r="11" class="bx"/><text x="14" y="314.9" class="t" font-size="14" text-anchor="middle">2</text><path d="M14 196V297" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="32" y="402" width="306" height="62" rx="6" class="bx"/><text x="44" y="429" class="x" font-size="14">Frozen by an authorized <tspan class="mono">Protected</tspan></text><text x="44" y="448" class="x" font-size="14">attempt, and this is not its completion?</text><circle cx="14" cy="422" r="11" class="bx"/><text x="14" y="426.9" class="t" font-size="14" text-anchor="middle">3</text><path d="M14 321V409" class="fl" marker-end="url(#perch-ah)"/><path d="M44 464V485H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="472" width="141.29" height="26" rx="13" class="pill pill-d"/><text x="73" y="490.04" class="d" font-size="14">AccountFrozen · 2</text></g><g><rect x="32" y="508" width="306" height="62" rx="6" class="bx"/><text x="44" y="535" class="x" font-size="14">A selected grant rule calls the recovery</text><text x="44" y="554" class="x" font-size="14">controller, its ZK adapter or its ZK pool?</text><circle cx="14" cy="528" r="11" class="bx"/><text x="14" y="532.9" class="t" font-size="14" text-anchor="middle">4</text><path d="M14 433V515" class="fl" marker-end="url(#perch-ah)"/><path d="M44 570V591H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="578" width="147.01" height="26" rx="13" class="pill pill-d"/><text x="73" y="596.04" class="d" font-size="14">GrantEscalation · 4</text></g><g><rect x="48" y="614" width="290" height="157" rx="6" class="bx bx-hi"/><text x="60" y="641" class="x" font-size="14">A completion leaves here. The recovery</text><text x="60" y="660" class="x" font-size="14">controller's <tspan class="mono">rcv_complete</tspan> checks the</text><text x="60" y="679" class="x" font-size="14">exact approved document bytes and the</text><text x="60" y="698" class="x" font-size="14">completion window: authorized with no</text><text x="60" y="717" class="x" font-size="14">signatures, or refused.</text><text x="60" y="736" class="m tag" font-size="14">TESTED · RECOVERY</text><text x="60" y="755" class="m tag" font-size="14">CONTROLLER</text><path d="M30 606V634H46" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="32" y="785" width="306" height="81" rx="6" class="bx"/><text x="44" y="812" class="x" font-size="14">bound = SHA-256(domain ‖ account ‖</text><text x="44" y="831" class="x" font-size="14">signature payload), with domain</text><text x="44" y="850" class="x" font-size="14"><tspan class="mono">"perch/account/auth-addr-v1"</tspan></text><circle cx="14" cy="805" r="11" class="bx"/><text x="14" y="809.9" class="t" font-size="14" text-anchor="middle">5</text><path d="M14 539V792" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="32" y="878" width="306" height="81" rx="6" class="bx"/><text x="44" y="905" class="x" font-size="14">Resolve the selected rule IDs to stored</text><text x="44" y="924" class="x" font-size="14">rules and spending records; convert the</text><text x="44" y="943" class="x" font-size="14">contexts.</text><circle cx="14" cy="898" r="11" class="bx"/><text x="14" y="902.9" class="t" font-size="14" text-anchor="middle">6</text><path d="M14 816V885" class="fl" marker-end="url(#perch-ah)"/><path d="M44 959V980H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="967" width="212.38" height="26" rx="13" class="pill pill-d"/><text x="73" y="985.04" class="d" font-size="14">ContextRuleNotFound · 3000</text><path d="M44 959V1012H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="999" width="155.99" height="26" rx="13" class="pill pill-d"/><text x="73" y="1017.04" class="d" font-size="14">RuleEvalRefused · 5</text></g><g><rect x="32" y="1035" width="306" height="119" rx="6" class="bx bx-pr"/><rect x="36" y="1039" width="298" height="111" rx="2" class="fl-g"/><text x="44" y="1062" class="x" font-size="14"><tspan class="mono">rule_eval::check_auth</tspan>: rules, records,</text><text x="44" y="1081" class="x" font-size="14">contexts, choices, signers, ledger,</text><text x="44" y="1100" class="x" font-size="14">generation → next records. No storage, no</text><text x="44" y="1119" class="x" font-size="14">signatures.</text><text x="44" y="1138" class="g tag" font-size="14">PROVED · MODEL + TRANSLATION</text><circle cx="14" cy="1055" r="11" class="bx"/><text x="14" y="1059.9" class="t" font-size="14" text-anchor="middle">7</text><path d="M14 909V1042" class="fl" marker-end="url(#perch-ah)"/><path d="M44 1154V1175H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="1162" width="112.7" height="26" rx="13" class="pill pill-d"/><text x="73" y="1180.04" class="d" font-size="14">StaleGrant · 3</text><path d="M44 1154V1207H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="1194" width="155.99" height="26" rx="13" class="pill pill-d"/><text x="73" y="1212.04" class="d" font-size="14">RuleEvalRefused · 5</text></g><g><rect x="32" y="1230" width="306" height="62" rx="6" class="bx"/><text x="44" y="1257" class="x" font-size="14">digest = SHA-256(bound ‖ XDR(selected</text><text x="44" y="1276" class="x" font-size="14">rule IDs)). For each claimed signer:</text><circle cx="14" cy="1250" r="11" class="bx"/><text x="14" y="1254.9" class="t" font-size="14" text-anchor="middle">8</text><path d="M14 1066V1237" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="48" y="1304" width="290" height="138" rx="6" class="bx"/><rect x="51" y="1307" width="11" height="132" rx="0" class="tr"/><text x="74" y="1331" class="x" font-size="14">External:</text><text x="74" y="1350" class="x" font-size="14"><tspan class="mono">verifier.verify(digest)</tspan>. A bad</text><text x="74" y="1369" class="x" font-size="14">signature traps in the verifier;</text><text x="74" y="1388" class="x" font-size="14"><tspan class="mono">ExternalVerificationFailed</tspan></text><text x="74" y="1407" class="x" font-size="14">(3003) only if a verifier returns false.</text><text x="74" y="1426" class="m tag" font-size="14">TRUSTED · VERIFIER</text><path d="M30 1296V1324H46" class="fl-m" marker-end="url(#perch-ah-m)"/><path d="M62 1442V1463H76" class="fl-d" marker-end="url(#perch-bar)"/><rect x="78" y="1450" width="205.81" height="26" rx="13" class="pill pill-d"/><text x="89" y="1468.04" class="d" font-size="14">verifier traps (bad signature)</text><rect x="48" y="1486" width="290" height="81" rx="6" class="bx bx-k"/><text x="60" y="1513" class="x" font-size="14">Delegated (CAP-0071): the host's</text><text x="60" y="1532" class="x" font-size="14"><tspan class="mono">delegate_auth</tspan>. Rule IDs are not</text><text x="60" y="1551" class="x" font-size="14">bound.</text><path d="M30 1324V1506H46" class="fl-k" marker-end="url(#perch-ah-k)"/></g><g><rect x="32" y="1583" width="306" height="62" rx="6" class="bx"/><text x="44" y="1610" class="x" font-size="14">Store each capped spending record that</text><text x="44" y="1629" class="x" font-size="14">changed. Authorized.</text><circle cx="14" cy="1603" r="11" class="bx"/><text x="14" y="1607.9" class="t" font-size="14" text-anchor="middle">9</text><path d="M14 1261V1590" class="fl" marker-end="url(#perch-ah)"/></g></svg>
