<svg class="wide" viewBox="0 0 760 1158" role="img" aria-labelledby="fig-check-auth-title" aria-describedby="fig-check-auth-text"><rect x="2" y="2" width="756" height="64" rx="6" class="bx bx-k"/><text x="14" y="30" class="x" font-size="15">Soroban host → <tspan class="mono">__check_auth(signature_payload, auth payload, contexts)</tspan>. The auth</text><text x="14" y="50" class="x" font-size="15">payload carries <tspan class="mono">context_rule_ids</tspan> and the claimed signers.</text><text x="2" y="96" class="m tag" font-size="14">ACCOUNT SHELL · TESTED</text><g><rect x="50" y="114" width="450" height="64" rx="6" class="bx"/><text x="62" y="142" class="x" font-size="15">A context calls a reserved hook on any contract: <tspan class="mono">install</tspan>,</text><text x="62" y="162" class="x" font-size="15"><tspan class="mono">uninstall</tspan>, <tspan class="mono">enforce</tspan> or an <tspan class="mono">rcv_*</tspan> name?</text><circle cx="26" cy="136" r="11" class="bx"/><text x="26" y="140.9" class="t" font-size="14" text-anchor="middle">1</text><path d="M500 133H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="120" width="161.71" height="26" rx="13" class="pill pill-d"/><text x="531" y="138.04" class="d" font-size="14">ReservedFunction · 1</text></g><g><rect x="50" y="190" width="450" height="64" rx="6" class="bx"/><text x="62" y="218" class="x" font-size="15">Recovery completion? Exactly one <tspan class="mono">apply_doc</tspan> context on</text><text x="62" y="238" class="x" font-size="15">this account, selecting the recovery rule. Classification only.</text><circle cx="26" cy="212" r="11" class="bx"/><text x="26" y="216.9" class="t" font-size="14" text-anchor="middle">2</text><path d="M26 147V199" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="50" y="266" width="450" height="64" rx="6" class="bx"/><text x="62" y="294" class="x" font-size="15">Frozen by an authorized <tspan class="mono">Protected</tspan> attempt, and this is not</text><text x="62" y="314" class="x" font-size="15">its completion?</text><circle cx="26" cy="288" r="11" class="bx"/><text x="26" y="292.9" class="t" font-size="14" text-anchor="middle">3</text><path d="M26 223V275" class="fl" marker-end="url(#perch-ah)"/><path d="M500 285H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="272" width="141.29" height="26" rx="13" class="pill pill-d"/><text x="531" y="290.04" class="d" font-size="14">AccountFrozen · 2</text></g><g><rect x="50" y="342" width="450" height="64" rx="6" class="bx"/><text x="62" y="370" class="x" font-size="15">A selected grant rule calls the recovery controller, its ZK</text><text x="62" y="390" class="x" font-size="15">adapter or its ZK pool?</text><circle cx="26" cy="364" r="11" class="bx"/><text x="26" y="368.9" class="t" font-size="14" text-anchor="middle">4</text><path d="M26 299V351" class="fl" marker-end="url(#perch-ah)"/><path d="M500 361H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="348" width="147.01" height="26" rx="13" class="pill pill-d"/><text x="531" y="366.04" class="d" font-size="14">GrantEscalation · 4</text></g><g><rect x="90" y="414" width="666" height="104" rx="6" class="bx bx-hi"/><text x="102" y="442" class="x" font-size="15">A completion leaves here. The recovery controller's <tspan class="mono">rcv_complete</tspan> checks the exact</text><text x="102" y="462" class="x" font-size="15">approved document bytes and the completion window: authorized with no signatures, or</text><text x="102" y="482" class="x" font-size="15">refused.</text><text x="102" y="502" class="m tag" font-size="14">TESTED · RECOVERY CONTROLLER</text><path d="M70 402V438H88" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="50" y="536" width="450" height="64" rx="6" class="bx"/><text x="62" y="564" class="x" font-size="15">bound = SHA-256(domain ‖ account ‖ signature payload),</text><text x="62" y="584" class="x" font-size="15">with domain <tspan class="mono">"perch/account/auth-addr-v1"</tspan></text><circle cx="26" cy="558" r="11" class="bx"/><text x="26" y="562.9" class="t" font-size="14" text-anchor="middle">5</text><path d="M26 375V545" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="50" y="612" width="450" height="64" rx="6" class="bx"/><text x="62" y="640" class="x" font-size="15">Resolve the selected rule IDs to stored rules and spending</text><text x="62" y="660" class="x" font-size="15">records; convert the contexts.</text><circle cx="26" cy="634" r="11" class="bx"/><text x="26" y="638.9" class="t" font-size="14" text-anchor="middle">6</text><path d="M26 569V621" class="fl" marker-end="url(#perch-ah)"/><path d="M500 631H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="618" width="212.38" height="26" rx="13" class="pill pill-d"/><text x="531" y="636.04" class="d" font-size="14">ContextRuleNotFound · 3000</text><path d="M500 665H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="652" width="155.99" height="26" rx="13" class="pill pill-d"/><text x="531" y="670.04" class="d" font-size="14">RuleEvalRefused · 5</text></g><g><rect x="50" y="690" width="450" height="104" rx="6" class="bx bx-pr"/><rect x="54" y="694" width="442" height="96" rx="2" class="fl-g"/><text x="62" y="718" class="x" font-size="15"><tspan class="mono">rule_eval::check_auth</tspan>: rules, records, contexts,</text><text x="62" y="738" class="x" font-size="15">choices, signers, ledger, generation → next records. No</text><text x="62" y="758" class="x" font-size="15">storage, no signatures.</text><text x="62" y="778" class="g tag" font-size="14">PROVED · MODEL + TRANSLATION</text><circle cx="26" cy="712" r="11" class="bx"/><text x="26" y="716.9" class="t" font-size="14" text-anchor="middle">7</text><path d="M26 645V699" class="fl" marker-end="url(#perch-ah)"/><path d="M500 709H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="696" width="112.7" height="26" rx="13" class="pill pill-d"/><text x="531" y="714.04" class="d" font-size="14">StaleGrant · 3</text><path d="M500 743H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="730" width="155.99" height="26" rx="13" class="pill pill-d"/><text x="531" y="748.04" class="d" font-size="14">RuleEvalRefused · 5</text></g><g><rect x="50" y="806" width="450" height="64" rx="6" class="bx"/><text x="62" y="834" class="x" font-size="15">digest = SHA-256(bound ‖ XDR(selected rule IDs)). For each</text><text x="62" y="854" class="x" font-size="15">claimed signer:</text><circle cx="26" cy="828" r="11" class="bx"/><text x="26" y="832.9" class="t" font-size="14" text-anchor="middle">8</text><path d="M26 723V815" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="90" y="878" width="410" height="124" rx="6" class="bx"/><rect x="93" y="881" width="11" height="118" rx="0" class="tr"/><text x="116" y="906" class="x" font-size="15">External: <tspan class="mono">verifier.verify(digest)</tspan>. A bad</text><text x="116" y="926" class="x" font-size="15">signature traps in the verifier;</text><text x="116" y="946" class="x" font-size="15"><tspan class="mono">ExternalVerificationFailed</tspan> (3003) only if a</text><text x="116" y="966" class="x" font-size="15">verifier returns false.</text><text x="116" y="986" class="m tag" font-size="14">TRUSTED · VERIFIER</text><path d="M70 866V902H88" class="fl-m" marker-end="url(#perch-ah-m)"/><path d="M500 897H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="884" width="205.81" height="26" rx="13" class="pill pill-d"/><text x="531" y="902.04" class="d" font-size="14">verifier traps (bad signature)</text><rect x="90" y="1010" width="410" height="64" rx="6" class="bx bx-k"/><text x="102" y="1038" class="x" font-size="15">Delegated (CAP-0071): the host's <tspan class="mono">delegate_auth</tspan>.</text><text x="102" y="1058" class="x" font-size="15">Rule IDs are not bound.</text><path d="M70 902V1030H88" class="fl-k" marker-end="url(#perch-ah-k)"/></g><g><rect x="50" y="1092" width="450" height="64" rx="6" class="bx"/><text x="62" y="1120" class="x" font-size="15">Store each capped spending record that changed.</text><text x="62" y="1140" class="x" font-size="15">Authorized.</text><circle cx="26" cy="1114" r="11" class="bx"/><text x="26" y="1118.9" class="t" font-size="14" text-anchor="middle">9</text><path d="M26 839V1101" class="fl" marker-end="url(#perch-ah)"/></g></svg>
