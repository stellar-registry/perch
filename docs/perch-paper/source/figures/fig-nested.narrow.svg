<svg class="narrow" viewBox="0 0 340 713" role="img" aria-labelledby="fig-nested-title" aria-describedby="fig-nested-text"><text x="2" y="16" class="t tag" font-size="14">ONE GRANT, THE CALL INSIDE IT</text><text x="2" y="44" class="t" font-size="15">The app’s grant</text><rect x="2" y="56" width="336" height="81" rx="6" class="bx bx-k"/><text x="14" y="83" class="t" font-size="14">Rule <tspan class="mono">game</tspan></text><text x="14" y="102" class="m" font-size="14">any function of the game contract, signed by</text><text x="14" y="121" class="m" font-size="14">the app’s key</text><rect x="2" y="145" width="336" height="138" rx="6" class="bx bx-k"/><text x="14" y="172" class="t" font-size="14">Rule <tspan class="mono">pay-game</tspan></text><text x="14" y="191" class="x" font-size="14">the XLM token’s <tspan class="mono">transfer</tspan> only</text><text x="14" y="210" class="x" font-size="14">argument 0 is the account itself</text><text x="14" y="229" class="x" font-size="14">only when the entry’s root call is exactly</text><text x="14" y="248" class="x" font-size="14"><tspan class="mono">game.guess</tspan></text><text x="14" y="267" class="x" font-size="14">at most 2 XLM in any 100 ledgers</text><text x="2" y="319" class="t" font-size="15">The entry the app signs</text><rect x="2" y="331" width="336" height="81" rx="6" class="bx"/><text x="14" y="358" class="m" font-size="14">1 root call</text><text x="14" y="377" class="x" font-size="14"><tspan class="mono">game.guess(3, account)</tspan></text><text x="14" y="396" class="g" font-size="14">✓ rule <tspan class="mono">game</tspan>: a call to the game contract</text><path d="M20 414V430" class="fl" marker-end="url(#perch-ah)"/><rect x="18" y="434" width="320" height="119" rx="6" class="bx"/><text x="30" y="461" class="m" font-size="14">2 call inside it, on a loss</text><text x="30" y="480" class="x" font-size="14"><tspan class="mono">XLM.transfer(account, game, 1 XLM)</tspan></text><text x="30" y="499" class="g" font-size="14">✓ rule <tspan class="mono">pay-game</tspan>: from the account</text><text x="30" y="518" class="g" font-size="14">✓ the entry’s root is exactly <tspan class="mono">game.guess</tspan></text><text x="30" y="537" class="g" font-size="14">✓ 1 of 2 XLM in the window</text><rect x="2" y="571" width="336" height="138" rx="6" class="bx bx-no"/><text x="14" y="598" class="d" font-size="14">Refused, with nothing written</text><text x="14" y="617" class="x" font-size="14">✕ the same transfer signed as its own entry: its</text><text x="14" y="636" class="x" font-size="14">root is <tspan class="mono">XLM.transfer</tspan></text><text x="14" y="655" class="x" font-size="14">✕ the transfer under <tspan class="mono">game.other</tspan>, or under</text><text x="14" y="674" class="x" font-size="14">another game’s <tspan class="mono">guess</tspan></text><text x="14" y="693" class="x" font-size="14">✕ a third loss within 100 ledgers: over the cap</text></svg>
