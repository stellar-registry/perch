<svg class="wide" viewBox="0 0 760 523" role="img" aria-labelledby="fig-nested-title" aria-describedby="fig-nested-text"><text x="2" y="16" class="t tag" font-size="14">ONE GRANT, THE CALL AND THE PAYMENT INSIDE IT</text><rect x="2" y="30" width="262" height="346" rx="8" class="bx bx-k"/><text x="16" y="54" class="t" font-size="15">The app’s grant</text><rect x="16" y="66" width="234" height="100" rx="6" class="bx"/><text x="28" y="93" class="t" font-size="14">Rule <tspan class="mono">game</tspan></text><text x="28" y="112" class="m" font-size="14">any function of the game</text><text x="28" y="131" class="m" font-size="14">contract, signed by the app’s</text><text x="28" y="150" class="m" font-size="14">key</text><rect x="16" y="178" width="234" height="176" rx="6" class="bx"/><text x="28" y="205" class="t" font-size="14">Rule <tspan class="mono">pay-game</tspan></text><text x="28" y="224" class="x" font-size="14">the XLM token’s <tspan class="mono">transfer</tspan> only</text><text x="28" y="243" class="x" font-size="14">argument 0 is the account itself</text><text x="28" y="262" class="x" font-size="14">argument 1 is the game</text><text x="28" y="281" class="x" font-size="14">only when the entry’s root call is</text><text x="28" y="300" class="x" font-size="14">exactly <tspan class="mono">game.guess</tspan></text><text x="28" y="319" class="x" font-size="14">at most 2 XLM in any 100</text><text x="28" y="338" class="x" font-size="14">ledgers</text><text x="300" y="54" class="t" font-size="15">The entry the app signs</text><rect x="300" y="66" width="458" height="81" rx="6" class="bx"/><text x="312" y="93" class="m" font-size="14">1 root call</text><text x="312" y="112" class="x" font-size="14"><tspan class="mono">game.guess(3, account)</tspan></text><text x="312" y="131" class="g" font-size="14">✓ rule <tspan class="mono">game</tspan>: a call to the game contract</text><rect x="328" y="169" width="430" height="119" rx="6" class="bx"/><text x="340" y="196" class="m" font-size="14">2 call inside it, on a loss</text><text x="340" y="215" class="x" font-size="14"><tspan class="mono">XLM.transfer(account, game, 1 XLM)</tspan></text><text x="340" y="234" class="g" font-size="14">✓ rule <tspan class="mono">pay-game</tspan>: from the account, to the game</text><text x="340" y="253" class="g" font-size="14">✓ the entry’s root is exactly <tspan class="mono">game.guess</tspan></text><text x="340" y="272" class="g" font-size="14">✓ 1 of 2 XLM in the window</text><path d="M312 147V193H324" class="fl" marker-end="url(#perch-ah)"/><path d="M250 116H282V90H296" class="fl-k dash" marker-end="url(#perch-ah-k)"/><path d="M250 266H282V228.5H324" class="fl-k dash" marker-end="url(#perch-ah-k)"/><rect x="2" y="400" width="756" height="119" rx="6" class="bx bx-no"/><text x="14" y="427" class="d" font-size="14">Refused, with nothing written</text><text x="14" y="446" class="x" font-size="14">✕ the same transfer signed as its own entry: its root is <tspan class="mono">XLM.transfer</tspan></text><text x="14" y="465" class="x" font-size="14">✕ the transfer under <tspan class="mono">game.other</tspan>, or under another game’s <tspan class="mono">guess</tspan></text><text x="14" y="484" class="x" font-size="14">✕ the stake sent to anyone but the game</text><text x="14" y="503" class="x" font-size="14">✕ a third loss within 100 ledgers: over the cap</text></svg>
