<svg class="narrow" viewBox="0 0 340 556" role="img" aria-labelledby="fig-overview-title" aria-describedby="fig-overview-text"><text x="2" y="16" class="t tag" font-size="14">WHO DOES WHAT</text><rect x="2" y="28" width="336" height="62" rx="6" class="bx"/><text x="14" y="55" class="t" font-size="14">Owner</text><text x="14" y="74" class="x" font-size="14">installs a grant (<tspan class="mono">apply_grant</tspan>)</text><path d="M40 92V108" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="112" width="336" height="62" rx="6" class="bx"/><text x="14" y="139" class="t" font-size="14">App or agent</text><text x="14" y="158" class="x" font-size="14">signs its own call</text><path d="M40 176V192" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="196" width="336" height="62" rx="6" class="bx"/><text x="14" y="223" class="t" font-size="14">Soroban host</text><text x="14" y="242" class="x" font-size="14">asks the account (<tspan class="mono">__check_auth</tspan>)</text><path d="M40 260V276" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="280" width="336" height="81" rx="6" class="bx"/><text x="14" y="307" class="t" font-size="14">Decision function</text><text x="14" y="326" class="x" font-size="14"><tspan class="mono">rule_eval::check_auth</tspan> checks the installed</text><text x="14" y="345" class="x" font-size="14">grant’s rules and window</text><path d="M40 363V379" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="383" width="336" height="81" rx="6" class="bx"/><text x="14" y="410" class="t" font-size="14">Verifier contract</text><text x="14" y="429" class="x" font-size="14">checks the signature, only after the decision</text><text x="14" y="448" class="x" font-size="14">accepts</text><path d="M40 466V482" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="486" width="336" height="62" rx="6" class="bx"/><text x="14" y="513" class="t" font-size="14">Store</text><text x="14" y="532" class="x" font-size="14">the new window record</text></svg>
