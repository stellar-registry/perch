<svg class="wide" viewBox="0 0 760 437" role="img" aria-labelledby="fig-overview-title" aria-describedby="fig-overview-text"><text x="2" y="16" class="t tag" font-size="14">WHO DOES WHAT</text><rect x="2" y="44" width="170" height="84" rx="6" class="bx"/><text x="14" y="72" class="t" font-size="15">Owner</text><text x="14" y="92" class="m" font-size="15">the account’s</text><text x="14" y="112" class="m" font-size="15">administrator</text><rect x="2" y="196" width="170" height="64" rx="6" class="bx"/><text x="14" y="224" class="t" font-size="15">App or agent</text><text x="14" y="244" class="m" font-size="15">holds its own key</text><rect x="256" y="196" width="190" height="84" rx="6" class="bx"/><text x="268" y="224" class="t" font-size="15">Soroban host</text><text x="268" y="244" class="m" font-size="15">runs the call; asks each</text><text x="268" y="264" class="m" font-size="15">account</text><rect x="532" y="10" width="226" height="331" rx="8" class="bx bx-k"/><text x="546" y="34" class="t" font-size="15">Perch account</text><rect x="546" y="46" width="198" height="81" rx="6" class="bx"/><text x="558" y="73" class="t" font-size="14">Installed grant</text><text x="558" y="92" class="m" font-size="14">rules and spending</text><text x="558" y="111" class="m" font-size="14">records</text><rect x="546" y="141" width="198" height="100" rx="6" class="bx"/><text x="558" y="168" class="t" font-size="14">Decision function</text><text x="558" y="187" class="x" font-size="14"><tspan class="mono">rule_eval::check_auth</tspan></text><text x="558" y="206" class="x" font-size="14">checks the rules and the</text><text x="558" y="225" class="x" font-size="14">window</text><rect x="546" y="267" width="198" height="62" rx="6" class="bx"/><text x="558" y="294" class="t" font-size="14">Store</text><text x="558" y="313" class="m" font-size="14">the new window record</text><rect x="532" y="371" width="226" height="62" rx="6" class="bx"/><text x="544" y="398" class="t" font-size="14">Verifier contract</text><text x="544" y="417" class="m" font-size="14">checks the app’s signature</text><path d="M174 86.5H542" class="fl" marker-end="url(#perch-ah)"/><text x="190" y="76.5" class="x" font-size="14">1 installs a grant (<tspan class="mono">apply_grant</tspan>)</text><path d="M174 226H252" class="fl" marker-end="url(#perch-ah)"/><text x="182" y="216" class="x" font-size="14">2 signs</text><path d="M446 226H496V191H542" class="fl" marker-end="url(#perch-ah)"/><text x="488" y="145" class="x" font-size="14" text-anchor="end">3 asks the account</text><text x="488" y="162" class="x" font-size="14" text-anchor="end">(<tspan class="mono">__check_auth</tspan>)</text><path d="M750 191H756V367" class="fl-m dash" marker-end="url(#perch-ah-m)"/><path d="M600 243V263" class="fl" marker-end="url(#perch-ah)"/><text x="256" y="385" class="x" font-size="14">4 only after the decision accepts: the</text><text x="256" y="402" class="x" font-size="14">verifier checks the signature, then the</text><text x="256" y="419" class="x" font-size="14">record is stored</text></svg>
