<svg class="wide" viewBox="0 0 760 404" role="img" aria-labelledby="fig-overview-title" aria-describedby="fig-overview-text"><text x="2" y="16" class="t tag" font-size="14">WHO DOES WHAT</text><rect x="2" y="44" width="170" height="84" rx="6" class="bx"/><text x="14" y="72" class="t" font-size="15">Owner</text><text x="14" y="92" class="m" font-size="15">the account’s</text><text x="14" y="112" class="m" font-size="15">administrator</text><rect x="2" y="196" width="170" height="64" rx="6" class="bx"/><text x="14" y="224" class="t" font-size="15">App or agent</text><text x="14" y="244" class="m" font-size="15">holds its own key</text><rect x="214" y="196" width="190" height="84" rx="6" class="bx"/><text x="226" y="224" class="t" font-size="15">Soroban host</text><text x="226" y="244" class="m" font-size="15">runs the call; asks each</text><text x="226" y="264" class="m" font-size="15">account</text><rect x="428" y="10" width="330" height="364" rx="8" class="bx bx-k"/><text x="442" y="34" class="t" font-size="15">Perch account</text><rect x="442" y="46" width="302" height="62" rx="6" class="bx"/><text x="454" y="73" class="t" font-size="14">Installed grant</text><text x="454" y="92" class="m" font-size="14">rules and spending records</text><rect x="442" y="126" width="302" height="81" rx="6" class="bx"/><text x="454" y="153" class="t" font-size="14">Decision function</text><text x="454" y="172" class="x" font-size="14"><tspan class="mono">rule_eval::check_auth</tspan> checks the</text><text x="454" y="191" class="x" font-size="14">rules and the window</text><rect x="442" y="300" width="302" height="62" rx="6" class="bx"/><text x="454" y="327" class="t" font-size="14">Store after both checks pass</text><text x="454" y="346" class="m" font-size="14">the new window record</text><rect x="214" y="300" width="190" height="81" rx="6" class="bx"/><text x="226" y="327" class="t" font-size="14">Verifier contract</text><text x="226" y="346" class="m" font-size="14">checks the app’s</text><text x="226" y="365" class="m" font-size="14">signature</text><path d="M174 77H438" class="fl" marker-end="url(#perch-ah)"/><text x="190" y="49" class="x" font-size="14">1 installs a grant (<tspan class="mono">apply_grant</tspan>)</text><path d="M174 226H210" class="fl" marker-end="url(#perch-ah)"/><text x="174" y="179" class="x" font-size="14">2 signs</text><path d="M404 226H416V166.5H438" class="fl" marker-end="url(#perch-ah)"/><text x="398" y="136.5" class="x" font-size="14" text-anchor="end">3 asks the account</text><text x="398" y="153.5" class="x" font-size="14" text-anchor="end">(<tspan class="mono">__check_auth</tspan>)</text><path d="M593 209V289H309V296" class="fl" marker-end="url(#perch-ah)"/><text x="446" y="275" class="x" font-size="14">4 decision accepts</text><path d="M406 331H438" class="fl" marker-end="url(#perch-ah)"/><text x="442" y="396" class="x" font-size="14">5 valid signature → commit record</text><text x="2" y="396" class="x" font-size="14">Any refusal leaves the record unchanged.</text></svg>
