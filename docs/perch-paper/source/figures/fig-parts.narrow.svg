<svg class="narrow" viewBox="0 0 340 1038" role="img" aria-labelledby="fig-parts-title" aria-describedby="fig-parts-text"><rect x="18" y="2" width="320" height="62" rx="6" class="bx bx-k"/><text x="30" y="29" class="t" font-size="14">Owner, passkey wallet</text><text x="30" y="48" class="x" font-size="14">Signs account documents and grant installs.</text><rect x="18" y="76" width="320" height="62" rx="6" class="bx bx-k"/><text x="30" y="103" class="t" font-size="14">App (Guess the Number)</text><text x="30" y="122" class="x" font-size="14">Signs its calls with its grant key.</text><rect x="18" y="150" width="320" height="62" rx="6" class="bx bx-k"/><text x="30" y="177" class="t" font-size="14">Soroban host</text><text x="30" y="196" class="x" font-size="14">Calls <tspan class="mono">__check_auth</tspan> when an entry is used.</text><path d="M18 24H8V172H16" class="fl-k" marker-end="url(#perch-ah-k)"/><path d="M18 98H8" class="fl-k"/><path d="M60 212V238" class="fl" marker-end="url(#perch-ah)"/><text x="68" y="231" class="m" font-size="14"><tspan class="mono">__check_auth</tspan></text><rect x="2" y="240" width="336" height="307" rx="8" class="bx"/><text x="14" y="262" class="t" font-size="15">Perch account</text><rect x="14" y="272" width="312" height="81" rx="6" class="bx"/><text x="26" y="299" class="t" font-size="14"><tspan class="mono">__check_auth</tspan></text><text x="26" y="318" class="x" font-size="14">Account shell: guards, digest, signers</text><text x="26" y="337" class="m tag" font-size="14">TESTED</text><rect x="14" y="363" width="312" height="81" rx="6" class="bx bx-pr"/><rect x="18" y="367" width="304" height="73" rx="2" class="fl-g"/><text x="26" y="390" class="t" font-size="14"><tspan class="mono">rule_eval</tspan>, a linked library</text><text x="26" y="409" class="x" font-size="14"><tspan class="mono">check_auth</tspan>, <tspan class="mono">lower</tspan>, <tspan class="mono">lower_scoped</tspan></text><text x="26" y="428" class="g tag" font-size=