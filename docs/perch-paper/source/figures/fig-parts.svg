<svg class="wide" viewBox="0 0 760 406" role="img" aria-labelledby="fig-parts-title" aria-describedby="fig-parts-text"><rect x="2" y="2" width="244" height="84" rx="6" class="bx bx-k"/><text x="14" y="30" class="t" font-size="15">Owner, passkey wallet</text><text x="14" y="50" class="x" font-size="15">Signs account documents and</text><text x="14" y="70" class="x" font-size="15">grant installs.</text><rect x="258" y="2" width="244" height="84" rx="6" class="bx bx-k"/><text x="270" y="30" class="t" font-size="15">App (Guess the Number)</text><text x="270" y="50" class="x" font-size="15">Signs its calls with its grant</text><text x="270" y="70" class="x" font-size="15">key.</text><rect x="514" y="2" width="244" height="84" rx="6" class="bx bx-k"/><text x="526" y="30" class="t" font-size="15">Soroban host</text><text x="526" y="50" class="x" font-size="15">Calls <tspan class="mono">__check_auth</tspan> for each</text><text x="526" y="70" class="x" font-size="15">authorization entry.</text><path d="M502 44H512" class="fl-k" marker-end="url(#perch-ah-k)"/><path d="M123 86V100H590V88" class="fl-k" marker-end="url(#perch-ah-k)"/><path d="M690 86V114" class="fl" marker-end="url(#perch-ah)"/><text x="682" y="112" class="m" font-size="14" text-anchor="end"><tspan class="mono">__check_auth</tspan></text><rect x="2" y="116" width="756" height="148" rx="8" class="bx"/><text x="14" y="139" class="t" font-size="16">Perch account, <tspan class="mono">perch_account.wasm</tspan></text><rect x="14" y="148" width="200" height="104" rx="6" class="bx"/><text x="26" y="176" class="t" font-size="15"><tspan class="mono">__check_auth</tspan></text><text x="26" y="196" class="x" font-size="15">Account shell: guards,</text><text x="26" y="216" class="x" font-size="15">digest, signers</text><text x="26" y="236" class="m tag" font-size="14">TESTED</text><rect x="226" y="148" width="292" height="104" rx="6" class="bx bx-pr"/><rect x="230" y="152" width="284" height="96" rx="2" class="fl-g"/><text x="238" y="176" class="t" font-size="15"><tspan class="mono">rule_eval</tspan>, a linked library</text><text x="238" y="196" class="x" font-size="14"><tspan class="mono">authorize</tspan>, <tspan class="mono">lower</tspan>, <tspan class="mono">lower_scoped</tspan></text><text x="238" y="216" class="g tag" font-size="14">PROVED</text><rect x="530" y="148" width="216" height="104" rx="6" class="bx"/><text x="542" y="176" class="t" font-size="15">Storage</text><text x="542" y="196" class="x" font-size="15">Rules, grants, spending</text><text x="542" y="216" class="x" font-size="15">records, grant generation,</text><text x="542" y="236" class="x" font-size="15">credential index</text><path d="M214 200H224" class="fl-m" marker-end="url(#perch-ah-m)"/><path d="M32 264V288" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="290" width="176" height="114" rx="6" class="bx"/><rect x="5" y="293" width="11" height="108" rx="0" class="tr"/><text x="28" y="317" class="a" font-size="14">Every authorization</text><text x="28" y="335" class="t" font-size="14">Verifier contracts</text><text x="28" y="353" class="x" font-size="14">Ed25519, WebAuthn</text><text x="28" y="371" class="m tag" font-size="14">TRUSTED</text><path d="M218 264V288" class="fl" marker-end="url(#perch-ah)"/><rect x="188" y="290" width="176" height="114" rx="6" class="bx"/><text x="200" y="317" class="a" font-size="14">Every install</text><text x="200" y="335" class="t" font-size="14">Document compiler</text><text x="200" y="353" class="x" font-size="14">Resolves names in</text><text x="200" y="371" class="x" font-size="14"><tspan class="mono">perch/verifiers</tspan></text><text x="200" y="389" class="m tag" font-size="14">TESTED</text><path d="M404 264V288" class="fl" marker-end="url(#perch-ah)"/><rect x="374" y="290" width="202" height="114" rx="6" class="bx"/><text x="386" y="317" class="a" font-size="14">Account-document writes,</text><text x="386" y="335" class="a" font-size="14">upgrades, cancellations,</text><text x="386" y="353" class="a" font-size="14">completions</text><text x="386" y="371" class="t" font-size="14">Recovery controller</text><text x="386" y="389" class="m tag" font-size="14">TESTED</text><path d="M616 264V288" class="fl" marker-end="url(#perch-ah)"/><rect x="586" y="290" width="92" height="114" rx="6" class="bx"/><text x="598" y="317" class="a" font-size="14">Enrollment</text><text x="598" y="335" class="t" font-size="14">ZK pool</text><text x="598" y="353" class="m tag" font-size="14">TESTED</text><path d="M718 264V288" class="fl" marker-end="url(#perch-ah)"/><text x="692" y="312" class="a" font-size="14">Owner</text><text x="692" y="330" class="a" font-size="14"><tspan class="mono">execute</tspan></text><text x="692" y="352" class="t" font-size="14">Any</text><text x="692" y="370" class="t" font-size="14">contract</text></svg>
