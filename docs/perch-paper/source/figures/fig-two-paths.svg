<svg class="wide" viewBox="0 0 760 766" role="img" aria-labelledby="fig-two-paths-title" aria-describedby="fig-two-paths-text" data-walk="phases"><text x="150" y="18" class="t" font-size="16">Perch</text><text x="150" y="38" class="m" font-size="14">passkey; WebAuthn verifier contract</text><text x="460" y="18" class="t" font-size="16">OpenZeppelin v0.8.0</text><text x="460" y="38" class="m" font-size="14">interpreter, spending_limit; delegated signer</text><g data-step="1" data-phase="call"><circle cx="14" cy="72" r="11" class="bx"/><text x="14" y="76.9" class="t" font-size="14" text-anchor="middle">1</text><text x="32" y="77" class="t" font-size="15">Host call</text><g data-detail="Perch 0b3752d crates/perch-smart-account/src/lib.rs:1950-1957 · receives the payload&#x27;s rule IDs and signers"><rect x="150" y="52" width="298" height="74" rx="6" class="bx"/><g data-scenario="lost overcap"><text x="162" y="75" class="x" font-size="14">The host calls <tspan class="mono">__check_auth</tspan> with two</text><text x="162" y="93" class="x" font-size="14">contexts: the <tspan class="mono">guess</tspan>, then the transfer it</text><text x="162" y="111" class="x" font-size="14">makes.</text></g><g data-scenario="direct" data-print="no"><text x="162" y="75" class="x" font-size="14">The host calls <tspan class="mono">__check_auth</tspan> with one</text><text x="162" y="93" class="x" font-size="14">context: the transfer.</text></g></g><g data-detail="stellar-contracts v0.8.0 packages/accounts/src/smart_account/storage.rs:629-637 · one rule ID per context"><rect x="460" y="52" width="298" height="74" rx="6" class="bx"/><g data-scenario="lost overcap"><text x="472" y="75" class="x" font-size="14">The host calls <tspan class="mono">__check_auth</tspan>, which runs</text><text x="472" y="93" class="x" font-size="14"><tspan class="mono">do_check_auth</tspan> on the same two</text><text x="472" y="111" class="x" font-size="14">contexts.</text></g><g data-scenario="direct" data-print="no"><text x="472" y="75" class="x" font-size="14">The host calls <tspan class="mono">__check_auth</tspan>, which runs</text><text x="472" y="93" class="x" font-size="14"><tspan class="mono">do_check_auth</tspan> on one context: the</text><text x="472" y="111" class="x" font-size="14">transfer.</text></g></g></g><g data-step="2" data-phase="select"><circle cx="14" cy="156" r="11" class="bx"/><text x="14" y="160.9" class="t" font-size="14" text-anchor="middle">2</text><text x="32" y="161" class="t" font-size="15">Rule selection</text><g data-detail="Perch 0b3752d crates/perch-smart-account/src/lib.rs:1164-1204; Perch 0b3752d crates/perch-smart-account/src/gate.rs:89-110 · reads the rule set, grant tags, freeze and spending records"><rect x="150" y="136" width="298" height="74" rx="6" class="bx"/><text x="162" y="159" class="x" font-size="14">Guards: reserved hooks, freeze, excluded</text><text x="162" y="177" class="x" font-size="14">set. Each rule ID resolves to a stored rule</text><text x="162" y="195" class="x" font-size="14">and its spending record.</text></g><g data-detail="stellar-contracts v0.8.0 packages/accounts/src/smart_account/storage.rs:312-367; stellar-contracts v0.8.0 packages/accounts/src/smart_account/storage.rs:639-671 · reads each selected context rule; checks each payload signer against the selected rules&#x27; signers"><rect x="460" y="136" width="298" height="74" rx="6" class="bx"/><text x="472" y="159" class="x" font-size="14">Each rule must exist, be unexpired and</text><text x="472" y="177" class="x" font-size="14">match its context's contract; a signer on</text><text x="472" y="195" class="x" font-size="14">no selected rule is refused (3016).</text></g></g><g data-step="3" data-phase="decide"><circle cx="14" cy="240" r="11" class="bx"/><text x="14" y="244.9" class="t" font-size="14" text-anchor="middle">3</text><text x="32" y="245" class="t" font-size="15">Decision</text><g data-detail="Perch 0b3752d crates/perch-smart-account/src/gate.rs:111-133 · reads rules, records, ledger and grant generation; writes nothing"><rect x="150" y="220" width="298" height="108" rx="6" class="bx"/><g data-scenario="lost overcap"><text x="162" y="243" class="x" font-size="14"><tspan class="mono">rule_eval::check_auth</tspan> decides both</text><text x="162" y="261" class="x" font-size="14">contexts: function, recipient, signers,</text><text x="162" y="279" class="x" font-size="14">expiry and the window cap.</text></g><g data-scenario="direct" data-print="no"><text x="162" y="243" class="x" font-size="14"><tspan class="mono">rule_eval::check_auth</tspan> decides the</text><text x="162" y="261" class="x" font-size="14">transfer alone; the window cap charges it.</text></g><g data-scenario="overcap"><path d="M162 307H176" class="fl-d" marker-end="url(#perch-bar)"/><path d="M185 302l10 10M195 302l-10 10" class="gl-d"/><rect x="202" y="294" width="155.99" height="26" rx="13" class="pill pill-d"/><text x="213" y="312.04" class="d" font-size="14">RuleEvalRefused · 5</text></g></g><g data-detail="stellar-contracts v0.8.0 packages/accounts/src/smart_account/storage.rs:358-364 · with policies, the signer check is deferred to enforce"><rect x="460" y="220" width="298" height="108" rx="6" class="bx dash"/><text x="472" y="243" class="m" font-size="14">No decision here: a rule with policies</text><text x="472" y="261" class="m" font-size="14">leaves it to them.</text></g></g><g data-step="4" data-phase="digest"><circle cx="14" cy="358" r="11" class="bx"/><text x="14" y="362.9" class="t" font-size="14" text-anchor="middle">4</text><text x="32" y="363" class="t" font-size="15">Digest</text><g data-detail="Perch 0b3752d crates/perch-smart-account/src/lib.rs:1212; Perch 0b3752d crates/perch-smart-account/src/gate.rs:134-138 · computes the digest an external signer signs" data-unreached="overcap"><rect x="150" y="338" width="298" height="74" rx="6" class="bx"/><text x="162" y="361" class="x" font-size="14">digest = SHA-256(bound ‖ XDR(rule</text><text x="162" y="379" class="x" font-size="14">IDs)); bound hashes the payload with the</text><text x="162" y="397" class="x" font-size="14">account.</text></g><g data-detail="stellar-contracts v0.8.0 packages/accounts/src/smart_account/storage.rs:157-175; stellar-contracts v0.8.0 packages/accounts/src/smart_account/storage.rs:659-663 · the value a delegated signer authorizes"><rect x="460" y="338" width="298" height="74" rx="6" class="bx"/><text x="472" y="361" class="x" font-size="14"><tspan class="mono">AuthDigestPreimage</tspan> holds the</text><text x="472" y="379" class="x" font-size="14">account, the payload and the rule IDs.</text></g></g><g data-step="5" data-phase="authenticate"><circle cx="14" cy="442" r="11" class="bx"/><text x="14" y="446.9" class="t" font-size="14" text-anchor="middle">5</text><text x="32" y="447" class="t" font-size="15">Authentication</text><g data-detail="Perch 0b3752d crates/perch-smart-account/src/auth.rs:47-58 · one call out of the account, in this authorization entry" data-unreached="overcap"><rect x="150" y="422" width="298" height="92" rx="6" class="bx"/><text x="162" y="445" class="x" font-size="14">Calls the WebAuthn verifier contract:</text><text x="162" y="463" class="x" font-size="14"><tspan class="mono">verify(digest)</tspan> checks the passkey</text><text x="162" y="481" class="x" font-size="14">signature.</text></g><g data-detail="stellar-contracts v0.8.0 packages/accounts/src/smart_account/storage.rs:668-674; stellar-contracts v0.8.0 packages/accounts/src/smart_account/storage.rs:408-411 · require_auth_for_args on the delegated address"><rect x="460" y="422" width="298" height="92" rx="6" class="bx"/><text x="472" y="445" class="x" font-size="14">The Stellar account authorizes</text><text x="472" y="463" class="x" font-size="14"><tspan class="mono">__check_auth(preimage)</tspan> in its own</text><text x="472" y="481" class="x" font-size="14">second authorization entry, which the</text><text x="472" y="499" class="x" font-size="14">host checks.</text></g></g><g data-step="6" data-phase="policies"><circle cx="14" cy="544" r="11" class="bx"/><text x="14" y="548.9" class="t" font-size="14" text-anchor="middle">6</text><text x="32" y="549" class="t" font-size="15">Policies</text><g data-detail="Perch 0b3752d crates/perch-smart-account/src/gate.rs:71-151 · no call" data-unreached="overcap"><rect x="150" y="524" width="298" height="126" rx="6" class="bx dash"/><text x="162" y="547" class="m" font-size="14">No policies: the account decided in phase</text><text x="162" y="565" class="m" font-size="14">3.</text></g><g data-detail="stellar-contracts v0.8.0 packages/accounts/src/smart_account/storage.rs:676-686; stellar-contracts v0.8.0 packages/accounts/src/smart_account/storage.rs:830; stellar-contracts v0.8.0 packages/accounts/src/smart_account/storage.rs:1304; oz-policy-builder 43b13ed contracts/stellar/policy-interpreter/src/lib.rs:192-277; stellar-contracts v0.8.0 packages/accounts/src/policies/spending_limit.rs:233-298 · calls out of the account: each attached policy, in stored order (address order at rule creation; add_policy appends)"><rect x="460" y="524" width="298" height="126" rx="6" class="bx"/><g data-scenario="lost overcap"><text x="472" y="547" class="x" font-size="14">Each rule's policies run <tspan class="mono">enforce</tspan> in</text><text x="472" y="565" class="x" font-size="14">stored order: the interpreter on the</text><text x="472" y="583" class="x" font-size="14"><tspan class="mono">guess</tspan>; on the transfer, <tspan class="mono">spending_limit</tspan></text><text x="472" y="601" class="x" font-size="14">first, then the interpreter.</text></g><g data-scenario="direct" data-print="no"><text x="472" y="547" class="x" font-size="14">On the transfer, the policies run <tspan class="mono">enforce</tspan></text><text x="472" y="565" class="x" font-size="14">in stored order: <tspan class="mono">spending_limit</tspan> first,</text><text x="472" y="583" class="x" font-size="14">then the interpreter.</text></g><g data-scenario="overcap"><path d="M472 629H486" class="fl-d" marker-end="url(#perch-bar)"/><path d="M495 624l10 10M505 624l-10 10" class="gl-d"/><rect x="512" y="616" width="225.46" height="26" rx="13" class="pill pill-d"/><text x="523" y="634.04" class="d" font-size="14">SpendingLimitExceeded · 3221</text></g></g></g><g data-step="7" data-phase="commit"><circle cx="14" cy="680" r="11" class="bx"/><text x="14" y="684.9" class="t" font-size="14" text-anchor="middle">7</text><text x="32" y="685" class="t" font-size="15">Commit</text><g data-detail="Perch 0b3752d crates/perch-smart-account/src/gate.rs:142-149 · writes the spending record" data-unreached="overcap"><rect x="150" y="660" width="298" height="74" rx="6" class="bx"/><text x="162" y="683" class="x" font-size="14">Stores the transfer rule's changed</text><text x="162" y="701" class="x" font-size="14">spending record in the account.</text></g><g data-detail="stellar-contracts v0.8.0 packages/accounts/src/policies/spending_limit.rs:298; oz-policy-builder 43b13ed contracts/stellar/policy-interpreter/src/lib.rs:261-265 · writes in the two policy contracts" data-unreached="overcap"><rect x="460" y="660" width="298" height="74" rx="6" class="bx"/><text x="472" y="683" class="x" font-size="14">Writes made in <tspan class="mono">enforce</tspan> stay:</text><text x="472" y="701" class="x" font-size="14"><tspan class="mono">spending_limit</tspan>'s history and the</text><text x="472" y="719" class="x" font-size="14">interpreter's TTL bumps.</text></g></g><text x="2" y="758" class="m" font-size="14">Cross and bar: where a guess over the cap is refused. Dashed: no such phase, or not reached in this scenario.</text></svg>
