<svg class="narrow" viewBox="0 0 340 1036" role="img" aria-labelledby="fig-attenuation-title" aria-describedby="fig-attenuation-text"><text x="2" y="16" class="m tag" font-size="14">MODEL</text><text x="60" y="16" class="m" font-size="14">computed; not run on chain</text><rect x="2" y="30" width="336" height="210" rx="6" class="bx"/><text x="14" y="52" class="t tag" font-size="14">PARENT GRANT</text><text x="14" y="74" class="t" font-size="14">rule play</text><text x="28" y="92" class="x" font-size="14">the game, any function</text><text x="28" y="110" class="x" font-size="14"><tspan class="mono">app</tspan> or <tspan class="mono">helper</tspan>, threshold 1</text><text x="28" y="128" class="x" font-size="14">last ledger 5000</text><text x="14" y="150" class="t" font-size="14">rule shop</text><text x="28" y="168" class="x" font-size="14">XLM, <tspan class="mono">transfer</tspan></text><text x="28" y="186" class="x" font-size="14">recipient is the shop</text><text x="28" y="204" class="x" font-size="14"><tspan class="mono">app</tspan> or <tspan class="mono">helper</tspan>, threshold 1</text><text x="28" y="222" class="x" font-size="14">cap 10 per 100 ledgers</text><text x="6" y="272" class="t tag" font-size="14">STEPS</text><g data-step-result="applied"><circle cx="17" cy="289" r="11" class="bx"/><text x="17" y="293.9" class="t" font-size="14" text-anchor="middle">1</text><text x="36" y="294" class="x" font-size="14">restrict <tspan class="mono">play</tspan> to <tspan class="mono">guess</tspan></text></g><g data-step-result="applied"><circle cx="17" cy="315" r="11" class="bx"/><text x="17" y="319.9" class="t" font-size="14" text-anchor="middle">2</text><text x="36" y="320" class="x" font-size="14">lower the cap limit to 4</text></g><g data-step-result="applied"><circle cx="17" cy="341" r="11" class="bx"/><text x="17" y="345.9" class="t" font-size="14" text-anchor="middle">3</text><text x="36" y="346" class="x" font-size="14">remove the signer <tspan class="mono">helper</tspan> from <tspan class="mono">shop</tspan></text></g><g data-step-result="refused"><path d="M12 362l10 10M22 362l-10 10" class="gl-d"/><text x="36" y="372" class="d" font-size="14">raise the cap limit to 20: refused (a higher</text><text x="36" y="390" class="d" font-size="14">limit); nothing changes</text></g><rect x="2" y="422" width="336" height="210" rx="6" class="bx"/><text x="14" y="444" class="t tag" font-size="14">CHILD GRANT</text><text x="14" y="466" class="t" font-size="14">rule play</text><rect x="16" y="471" width="5" height="16" rx="0" class="bx bx-k"/><text x="28" y="484" class="x" font-size="14">the game, <tspan class="mono">guess</tspan></text><text x="28" y="502" class="x" font-size="14"><tspan class="mono">app</tspan> or <tspan class="mono">helper</tspan>, threshold 1</text><text x="28" y="520" class="x" font-size="14">last ledger 5000</text><text x="14" y="542" class="t" font-size="14">rule shop</text><text x="28" y="560" class="x" font-size="14">XLM, <tspan class="mono">transfer</tspan></text><text x="28" y="578" class="x" font-size="14">recipient is the shop</text><rect x="16" y="583" width="5" height="16" rx="0" class="bx bx-k"/><text x="28" y="596" class="x" font-size="14"><tspan class="mono">app</tspan>, threshold 1</text><rect x="16" y="601" width="5" height="16" rx="0" class="bx bx-k"/><text x="28" y="614" class="x" font-size="14">cap 4 per 100 ledgers</text><text x="2" y="656" class="m" font-size="14">A bar marks a narrowed part. P: parent, C: child.</text><text x="2" y="686" class="t tag" font-size="14">PROBE</text><text x="236" y="686" class="t tag" font-size="14">P</text><text x="290" y="686" class="t tag" font-size="14">C</text><g data-probe="guess" data-parent="accepts" data-child="accepts"><line x1="2" y1="694" x2="338" y2="694" class="rule"/><text x="2" y="716" class="x" font-size="14">the game’s <tspan class="mono">guess</tspan></text><path d="M236 711l4 5l8-10" class="gl"/><path d="M290 711l4 5l8-10" class="gl"/></g><g data-probe="t1" data-parent="accepts" data-child="accepts"><line x1="2" y1="722" x2="338" y2="722" class="rule"/><text x="2" y="744" class="x" font-size="14">transfer 1 to the shop</text><path d="M236 739l4 5l8-10" class="gl"/><path d="M290 739l4 5l8-10" class="gl"/></g><g data-probe="t5" data-parent="accepts" data-child="refuses"><line x1="2" y1="750" x2="338" y2="750" class="rule"/><text x="2" y="772" class="x" font-size="14">transfer 5 to the shop</text><path d="M236 767l4 5l8-10" class="gl"/><path d="M291 762l10 10M301 762l-10 10" class="gl-d"/><path d="M305 760V774" class="fl-d"/></g><g data-probe="else" data-parent="refuses" data-child="refuses"><line x1="2" y1="778" x2="338" y2="778" class="rule"/><text x="2" y="800" class="x" font-size="14">transfer 1 elsewhere</text><path d="M237 790l10 10M247 790l-10 10" class="gl-d"/><path d="M251 788V802" class="fl-d"/><path d="M291 790l10 10M301 790l-10 10" class="gl-d"/><path d="M305 788V802" class="fl-d"/></g><g data-probe="approve" data-parent="refuses" data-child="refuses"><line x1="2" y1="806" x2="338" y2="806" class="rule"/><text x="2" y="828" class="x" font-size="14"><tspan class="mono">approve</tspan> on XLM</text><path d="M237 818l10 10M247 818l-10 10" class="gl-d"/><path d="M251 816V830" class="fl-d"/><path d="M291 818l10 10M301 818l-10 10" class="gl-d"/><path d="M305 816V830" class="fl-d"/></g><g data-probe="account" data-parent="refuses" data-child="refuses"><line x1="2" y1="834" x2="338" y2="834" class="rule"/><text x="2" y="856" class="x" font-size="14">a call to the account</text><path d="M237 846l10 10M247 846l-10 10" class="gl-d"/><path d="M251 844V858" class="fl-d"/><path d="M291 846l10 10M301 846l-10 10" class="gl-d"/><path d="M305 844V858" class="fl-d"/></g><g data-probe="helper" data-parent="accepts" data-child="refuses"><line x1="2" y1="862" x2="338" y2="862" class="rule"/><text x="2" y="884" class="x" font-size="14">a transfer signed by <tspan class="mono">helper</tspan></text><text x="2" y="902" class="x" font-size="14">alone</text><path d="M236 879l4 5l8-10" class="gl"/><path d="M291 874l10 10M301 874l-10 10" class="gl-d"/><path d="M305 872V886" class="fl-d"/></g><line x1="2" y1="908" x2="338" y2="908" class="rule"/><text x="2" y="932" class="t" font-size="14">The child accepts 2 of 7 probes, and the parent</text><text x="2" y="950" class="t" font-size="14">accepts each of them; the parent accepts 4.</text><text x="2" y="974" class="x" font-size="14">Replay: the child accepts 5 of 6 requests (a guess,</text><text x="2" y="992" class="x" font-size="14">then five transfers of 1, one ledger apart; the fifth</text><text x="2" y="1010" class="x" font-size="14">would make 5 &gt; 4). From empty records the parent</text><text x="2" y="1028" class="x" font-size="14">accepts all 5.</text></svg>
