# Releases are ON-CHAIN wasm publishes, not crates.io: release-plz only does
# version bump + changelog + per-crate git tags. The publish itself runs in the
# SAME release.yml run — gated on this run's `releases` output — so no tag/release
# trigger (and no GitHub App) is needed. The constructorless contracts publish to
# unverified/perch/constructorless via the scoped delegated CI key; spending-limit
# to the stateless registry.

[workspace]
# Never `cargo publish` — the workspace pins a git rev of stellar-accounts,
# which crates.io would reject anyway.
publish = false
# No crates.io consumers -> cargo-semver-checks is noise.
semver_check = false
changelog_update = true
dependencies_update = false
# Tags are the release markers. `publish = false` alone does NOT make
# release-plz read released versions from tags — that is `git_only` (without
# it, version detection queries crates.io, where no perch crate exists, and
# every version-bump PR would stall at the current version forever).
# `git_only = true` is why release.yml checks out with fetch-depth: 0.
git_only = true
# Only release (tag) on the merge of a release PR — never straight off an
# ordinary main push. Without this (default true) the FIRST successful run on
# main would tag every crate at its current version immediately, firing the
# publish chains before anyone merged a release PR.
release_always = false
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
# No GitHub Release per crate by default (avoids one release per member)...
git_release_enable = false
# CONTRACTS ONLY for now: releases are on-chain wasm publishes, so only the
# deployable contract crates take part (allowlisted below with
# `release = true`). Follow-up: enable the library crates too and publish
# those to crates.io (needs the stellar-accounts git pin resolved first).
release = false

# The deployable contracts. The three CONSTRUCTORLESS infra wasms
# (perch-interpreter / perch-doc-compiler / perch-ed25519-verifier) are tagged
# here; release.yml then drives the reusable stellar-registry/actions workflows
# (contract-release build+attest → registry-publish to
# unverified/perch/constructorless). Their GitHub Releases are created by that
# reusable build (git_release_enable stays off, so release-plz doesn't clash with
# its `gh release create`) — same arrangement as perch-spending-limit's chain.
# perch-account / perch-stateless-registry get tags + changelogs only.
[[package]]
name = "perch-account"
release = true

[[package]]
name = "perch-doc-compiler"
release = true

[[package]]
name = "perch-ed25519-verifier"
release = true

[[package]]
name = "perch-stateless-registry"
release = true

[[package]]
name = "perch-interpreter"
release = true

# perch-spending-limit's tag alone gates the build→attest→publish chain that
# runs inside release.yml itself (same-run `needs:` on the release-plz
# `releases` output, not a tag trigger). Its GitHub release is deliberately
# NOT created here — the stellar-registry/actions reusable workflow creates it
# at the tag (`gh release create` would fail on an existing release) and
# attaches the attested wasm + on-chain publish receipt.
[[package]]
name = "perch-spending-limit"
release = true
